<script type="text/babel" data-presets="flowboard-react-classic">
const { useState, useEffect, useMemo, useCallback, useRef, useContext, createContext } = React;

/* ============================== CONSTANTS ============================== */

const CATEGORIES = [
  { value: 'Work', label: 'Work', icon: '💼', color: '#5B5FEF' },
  { value: 'Personal', label: 'Personal', icon: '🌿', color: '#10B981' },
  { value: 'Learning', label: 'Learning', icon: '📚', color: '#F59E0B' },
  { value: 'Health', label: 'Health', icon: '❤️', color: '#EF4444' },
  { value: 'Finance', label: 'Finance', icon: '💰', color: '#06B6D4' },
  { value: 'Shopping', label: 'Shopping', icon: '🛍️', color: '#EC4899' },
  { value: 'Custom', label: 'Custom', icon: '✨', color: '#8B5CF6' },
];
const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c => [c.value, c]));

const PRIORITIES = [
  { value: 'Low', label: 'Low', weight: 1, color: '#6B7280', bg: '#F3F4F6' },
  { value: 'Medium', label: 'Medium', weight: 2, color: '#2563EB', bg: '#EFF6FF' },
  { value: 'High', label: 'High', weight: 3, color: '#D97706', bg: '#FFFBEB' },
  { value: 'Critical', label: 'Critical', weight: 4, color: '#DC2626', bg: '#FEF2F2' },
];
const PRIORITY_MAP = Object.fromEntries(PRIORITIES.map(p => [p.value, p]));

const STATUSES = [
  { value: 'Todo', label: 'To Do', color: '#6B7280', bg: '#F3F4F6' },
  { value: 'In Progress', label: 'In Progress', color: '#2563EB', bg: '#EFF6FF' },
  { value: 'Waiting', label: 'Waiting', color: '#D97706', bg: '#FFFBEB' },
  { value: 'Completed', label: 'Completed', color: '#059669', bg: '#ECFDF5' },
  { value: 'Cancelled', label: 'Cancelled', color: '#DC2626', bg: '#FEF2F2' },
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s => [s.value, s]));
const KANBAN_STATUSES = ['Todo', 'In Progress', 'Waiting', 'Completed'];

const NAV_ITEMS = [
  { key: 'dashboard', label: 'Dashboard', icon: 'layout-grid' },
  { key: 'today', label: 'Today', icon: 'sun' },
  { key: 'upcoming', label: 'Upcoming', icon: 'calendar-clock' },
  { key: 'calendar', label: 'Calendar', icon: 'calendar' },
  { key: 'kanban', label: 'Kanban', icon: 'columns' },
  { key: 'focus', label: 'Focus', icon: 'target' },
  { key: 'habits', label: 'Habits', icon: 'repeat' },
  { key: 'analytics', label: 'Analytics', icon: 'bar-chart' },
  { key: 'settings', label: 'Settings', icon: 'settings' },
];

const STORAGE_KEYS = {
  tasks: 'pd_tasks_v1',
  habits: 'pd_habits_v1',
  theme: 'pd_theme_v1',
  pomodoroSessions: 'pd_pomodoro_sessions_v1',
  pomodoroSettings: 'pd_pomodoro_settings_v1',
  accent: 'pd_accent_v1',
  compact: 'pd_compact_v1',
  sidebarCollapsed: 'pd_sidebar_collapsed_v1',
  notificationsEnabled: 'pd_notifications_enabled_v1',
};

const ACCENT_COLORS = [
  { name: 'Indigo', value: '#5B5FEF' },
  { name: 'Blue', value: '#2563EB' },
  { name: 'Emerald', value: '#059669' },
  { name: 'Rose', value: '#E11D48' },
  { name: 'Amber', value: '#D97706' },
  { name: 'Violet', value: '#7C3AED' },
];

/* ============================== UTILS ============================== */

function cn(...classes) { return classes.filter(Boolean).join(' '); }

function todayISO() { return toISODate(new Date()); }
function toISODate(date) {
  const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, '0'), d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function parseISODate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, (m ?? 1) - 1, d ?? 1);
}
function isToday(iso) { return !!iso && iso === todayISO(); }
function isOverdue(iso, status) {
  if (!iso || status === 'Completed' || status === 'Cancelled') return false;
  return parseISODate(iso).getTime() < parseISODate(todayISO()).getTime();
}
function isUpcoming(iso, withinDays = 7) {
  if (!iso) return false;
  const target = parseISODate(iso).getTime();
  const start = parseISODate(todayISO()).getTime();
  return target > start && target <= start + withinDays * 86400000;
}
function isTomorrow(iso) {
  if (!iso) return false;
  const d = new Date(); d.setDate(d.getDate() + 1);
  return iso === toISODate(d);
}
function isThisWeek(iso) {
  if (!iso) return false;
  const week = getWeekDates();
  const isoSet = new Set(week.map(toISODate));
  return isoSet.has(iso);
}
function formatFriendlyDate(iso) {
  if (!iso) return 'No due date';
  const date = parseISODate(iso), today = parseISODate(todayISO());
  const diffDays = Math.round((date.getTime() - today.getTime()) / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Tomorrow';
  if (diffDays === -1) return 'Yesterday';
  if (diffDays > 1 && diffDays < 7) return date.toLocaleDateString(undefined, { weekday: 'long' });
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: date.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
}
function formatTime(time) {
  if (!time) return '';
  const [h, m] = time.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM', hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}:${String(m).padStart(2, '0')} ${period}`;
}
function formatHeaderDate(date) {
  return date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function getWeekDates(reference = new Date()) {
  const day = reference.getDay();
  const monday = new Date(reference);
  monday.setDate(reference.getDate() - ((day + 6) % 7));
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
}
function getMonthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

function generateId() { return `t_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`; }

function matchesSearch(task, query) {
  if (!query.trim()) return true;
  const q = query.toLowerCase();
  return task.title.toLowerCase().includes(q) || task.description.toLowerCase().includes(q) ||
    task.category.toLowerCase().includes(q) || task.tags.some(t => t.toLowerCase().includes(q));
}

function applyFilters(tasks, filters) {
  return tasks.filter(t => !t.archived)
    .filter(t => matchesSearch(t, filters.search))
    .filter(t => {
      switch (filters.filter) {
        case 'pending': return t.status !== 'Completed' && t.status !== 'Cancelled';
        case 'completed': return t.status === 'Completed';
        case 'today': return isToday(t.dueDate);
        case 'overdue': return isOverdue(t.dueDate, t.status);
        case 'tomorrow': return isTomorrow(t.dueDate);
        case 'thisWeek': return isThisWeek(t.dueDate);
        case 'highPriority': return t.priority === 'High' || t.priority === 'Critical';
        case 'recurring': return !!t.recurring && t.recurring !== 'none';
        default: return true;
      }
    })
    .filter(t => filters.category === 'All' || t.category === filters.category)
    .filter(t => filters.priority === 'All' || t.priority === filters.priority)
    .filter(t => !filters.tag || filters.tag === 'All' || t.tags.includes(filters.tag));
}

function sortTasks(tasks, sort, direction) {
  const sorted = [...tasks].sort((a, b) => {
    let result = 0;
    switch (sort) {
      case 'priority': result = PRIORITY_MAP[b.priority].weight - PRIORITY_MAP[a.priority].weight; break;
      case 'dueDate': {
        const aTime = a.dueDate ? parseISODate(a.dueDate).getTime() : Infinity;
        const bTime = b.dueDate ? parseISODate(b.dueDate).getTime() : Infinity;
        result = aTime - bTime; break;
      }
      case 'createdAt': result = new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime(); break;
      case 'alphabetical': result = a.title.localeCompare(b.title); break;
    }
    return direction === 'asc' ? result : -result;
  });
  return sorted;
}

function getAllTags(tasks) {
  const set = new Set();
  tasks.filter(t => !t.archived).forEach(t => t.tags.forEach(tag => set.add(tag)));
  return Array.from(set).sort();
}

/** Productivity trend bucketed by day/week/month, each bucket showing tasks completed. */
function computeProductivityTrend(tasks, granularity = 'daily', periods = 7) {
  const completed = tasks.filter(t => !t.archived && t.status === 'Completed' && t.completedAt);
  const buckets = [];
  const now = new Date();

  if (granularity === 'monthly') {
    for (let i = periods - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      const count = completed.filter(t => t.completedAt.slice(0, 7) === key).length;
      buckets.push({ label: d.toLocaleDateString(undefined, { month: 'short' }), count });
    }
  } else if (granularity === 'weekly') {
    for (let i = periods - 1; i >= 0; i--) {
      const weekStart = stepPeriod(getWeekDates()[0], 'weekly', -i);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
      const startTime = weekStart.getTime(), endTime = weekEnd.getTime() + 86400000;
      const count = completed.filter(t => { const ct = new Date(t.completedAt).getTime(); return ct >= startTime && ct < endTime; }).length;
      buckets.push({ label: `${weekStart.getDate()}/${weekStart.getMonth() + 1}`, count });
    }
  } else {
    for (let i = periods - 1; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const iso = toISODate(d);
      const count = completed.filter(t => t.completedAt.slice(0, 10) === iso).length;
      buckets.push({ label: d.toLocaleDateString(undefined, { weekday: 'short' }), count });
    }
  }
  return buckets;
}

function computeAverageCompletionHours(tasks) {
  const done = tasks.filter(t => !t.archived && t.completedAt && t.createdAt);
  if (done.length === 0) return 0;
  const totalHours = done.reduce((sum, t) => sum + (new Date(t.completedAt) - new Date(t.createdAt)) / 3600000, 0);
  return Math.round((totalHours / done.length) * 10) / 10;
}

function computeMostProductiveDay(tasks) {
  const done = tasks.filter(t => !t.archived && t.completedAt);
  if (done.length === 0) return null;
  const counts = [0, 0, 0, 0, 0, 0, 0];
  done.forEach(t => counts[new Date(t.completedAt).getDay()]++);
  const maxIdx = counts.indexOf(Math.max(...counts));
  if (counts[maxIdx] === 0) return null;
  const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  return { day: names[maxIdx], count: counts[maxIdx] };
}

function computeMostProductiveHour(tasks) {
  const done = tasks.filter(t => !t.archived && t.completedAt);
  if (done.length === 0) return null;
  const counts = new Array(24).fill(0);
  done.forEach(t => counts[new Date(t.completedAt).getHours()]++);
  const maxIdx = counts.indexOf(Math.max(...counts));
  if (counts[maxIdx] === 0) return null;
  const hour12 = maxIdx % 12 === 0 ? 12 : maxIdx % 12;
  const label = `${hour12} ${maxIdx >= 12 ? 'PM' : 'AM'}`;
  return { hour: label, count: counts[maxIdx] };
}

/* ----- Pomodoro helpers ----- */

const POMODORO_DEFAULT_SETTINGS = { focusMinutes: 25, shortBreakMinutes: 5, longBreakMinutes: 15, sessionsUntilLongBreak: 4 };

function computeFocusStats(sessions) {
  const focusSessions = sessions.filter(s => s.type === 'focus');
  const today = todayISO();
  const week = new Set(getWeekDates().map(toISODate));
  const todaysSessions = focusSessions.filter(s => s.completedAt.slice(0, 10) === today);
  const weeklySessions = focusSessions.filter(s => week.has(s.completedAt.slice(0, 10)));
  const totalMinutes = focusSessions.reduce((sum, s) => sum + s.durationMinutes, 0);
  return {
    todayCount: todaysSessions.length,
    weekCount: weeklySessions.length,
    totalMinutes,
    totalSessions: focusSessions.length,
  };
}

function computeStats(tasks) {
  const active = tasks.filter(t => !t.archived);
  const todayCount = active.filter(t => isToday(t.dueDate)).length;
  const completed = active.filter(t => t.status === 'Completed').length;
  const pending = active.filter(t => t.status !== 'Completed' && t.status !== 'Cancelled').length;
  const overdue = active.filter(t => isOverdue(t.dueDate, t.status)).length;
  const highPriority = active.filter(t => (t.priority === 'High' || t.priority === 'Critical') && t.status !== 'Completed' && t.status !== 'Cancelled').length;
  const relevant = active.filter(t => t.status !== 'Cancelled');
  const completionPercent = relevant.length === 0 ? 0 : Math.round((completed / relevant.length) * 100);
  return { todayCount, completed, pending, overdue, highPriority, completionPercent };
}

/* ============================================================
   INTELLIGENCE ENGINE — everything below is deterministic,
   rule-based logic that runs entirely in the browser against
   localStorage data. No network calls, no external AI service.
   ============================================================ */

/* ----- Smart Dashboard: scores ----- */

function computeCompletionScore(tasks) {
  const active = tasks.filter(t => !t.archived && t.status !== 'Cancelled');
  const dueToday = active.filter(t => isToday(t.dueDate));
  if (dueToday.length > 0) {
    return Math.round((dueToday.filter(t => t.status === 'Completed').length / dueToday.length) * 100);
  }
  // fall back to trailing-week completion rate when nothing is due today
  const weekSet = new Set(getWeekDates().map(toISODate));
  const weekTasks = active.filter(t => t.dueDate && weekSet.has(t.dueDate));
  if (weekTasks.length === 0) return active.length === 0 ? 0 : Math.round((active.filter(t => t.status === 'Completed').length / active.length) * 100);
  return Math.round((weekTasks.filter(t => t.status === 'Completed').length / weekTasks.length) * 100);
}

function computeFocusScore(sessions, goalSessionsPerDay = 6) {
  const stats = computeFocusStats(sessions);
  return Math.min(100, Math.round((stats.todayCount / goalSessionsPerDay) * 100));
}

function computeDailyProductivityScore(tasks, sessions) {
  const completionScore = computeCompletionScore(tasks);
  const focusScore = computeFocusScore(sessions);
  const overdueCount = tasks.filter(t => !t.archived && isOverdue(t.dueDate, t.status)).length;
  const overduePenalty = Math.min(40, overdueCount * 8);
  const raw = 0.5 * completionScore + 0.3 * focusScore + 0.2 * 100 - overduePenalty;
  return Math.max(0, Math.min(100, Math.round(raw)));
}

function computeWeeklyPerformance(tasks) {
  const days = computeWeeklyProgress(tasks);
  const avg = days.length === 0 ? 0 : Math.round(days.reduce((s, d) => s + d.percent, 0) / days.length);
  return { days, average: avg };
}

/* ----- AI Suggestions (rule-based) ----- */

function suggestTopPriorities(tasks, count = 3) {
  const pending = tasks.filter(t => !t.archived && t.status !== 'Completed' && t.status !== 'Cancelled');
  const scored = pending.map(t => {
    const overdue = isOverdue(t.dueDate, t.status);
    const dueToday = isToday(t.dueDate);
    let score = PRIORITY_MAP[t.priority].weight * 10;
    if (overdue) score += 50;
    else if (dueToday) score += 25;
    if (t.dueDate) score += 5;
    return { task: t, score };
  });
  scored.sort((a, b) => b.score - a.score || (a.task.dueDate || '9999').localeCompare(b.task.dueDate || '9999'));
  return scored.slice(0, count).map(s => s.task);
}

function detectOverdueTasks(tasks) {
  return tasks.filter(t => !t.archived && isOverdue(t.dueDate, t.status))
    .sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
}

function suggestTomorrowPlan(tasks, count = 5) {
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowISO = toISODate(tomorrow);
  const dueTomorrow = tasks.filter(t => !t.archived && t.dueDate === tomorrowISO && t.status !== 'Completed' && t.status !== 'Cancelled');
  const carryOver = tasks.filter(t => !t.archived && t.status !== 'Completed' && t.status !== 'Cancelled' &&
    (isOverdue(t.dueDate, t.status) || isToday(t.dueDate)) && (t.priority === 'High' || t.priority === 'Critical'));
  const merged = [...dueTomorrow];
  carryOver.forEach(t => { if (!merged.find(m => m.id === t.id)) merged.push(t); });
  merged.sort((a, b) => PRIORITY_MAP[b.priority].weight - PRIORITY_MAP[a.priority].weight);
  return merged.slice(0, count);
}

function detectNeglectedTasks(tasks, staleDays = 5) {
  const cutoff = Date.now() - staleDays * 86400000;
  return tasks.filter(t => !t.archived && t.status !== 'Completed' && t.status !== 'Cancelled' &&
    !t.favorite && new Date(t.createdAt).getTime() < cutoff && (!t.dueDate || isOverdue(t.dueDate, t.status)))
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
}

function recommendNextTask(tasks) {
  const top = suggestTopPriorities(tasks, 1);
  return top.length > 0 ? top[0] : null;
}

/** Single most urgent thing to surface in the top-of-app reminder banner. */
function getUrgentReminder(tasks) {
  const overdue = detectOverdueTasks(tasks);
  if (overdue.length > 0) {
    return { level: 'overdue', message: overdue.length === 1 ? `"${overdue[0].title}" is overdue.` : `${overdue.length} tasks are overdue.`, task: overdue[0] };
  }
  const now = new Date();
  const dueSoon = tasks.filter(t => !t.archived && t.status !== 'Completed' && t.status !== 'Cancelled' && t.dueDate === todayISO() && t.dueTime)
    .map(t => {
      const [h, m] = t.dueTime.split(':').map(Number);
      const due = new Date(); due.setHours(h, m, 0, 0);
      return { task: t, diffMin: (due - now) / 60000 };
    })
    .filter(x => x.diffMin > 0 && x.diffMin <= 30)
    .sort((a, b) => a.diffMin - b.diffMin);
  if (dueSoon.length > 0) {
    return { level: 'upcoming', message: `"${dueSoon[0].task.title}" is due in ${Math.round(dueSoon[0].diffMin)} min.`, task: dueSoon[0].task };
  }
  return null;
}

/* ----- Time Estimation ----- */

const DEFAULT_ESTIMATE_BY_CATEGORY = { Work: 60, Personal: 30, Learning: 45, Health: 30, Finance: 30, Shopping: 20, Custom: 30 };

function suggestEstimatedMinutes(task, allTasks) {
  const similar = allTasks.filter(t => t.id !== task.id && t.category === task.category && t.actualMinutes);
  if (similar.length > 0) return Math.round(similar.reduce((s, t) => s + t.actualMinutes, 0) / similar.length);
  return DEFAULT_ESTIMATE_BY_CATEGORY[task.category] || 30;
}

function computeEstimateAccuracy(tasks) {
  const withBoth = tasks.filter(t => !t.archived && t.estimatedMinutes && t.actualMinutes);
  if (withBoth.length === 0) return null;
  const totalEst = withBoth.reduce((s, t) => s + t.estimatedMinutes, 0);
  const totalAct = withBoth.reduce((s, t) => s + t.actualMinutes, 0);
  const avgVariancePercent = Math.round(withBoth.reduce((s, t) => s + (t.actualMinutes - t.estimatedMinutes) / t.estimatedMinutes, 0) / withBoth.length * 100);
  return { count: withBoth.length, totalEst, totalAct, avgVariancePercent };
}

/* ----- Daily Review ----- */

function computeDailyReview(tasks, sessions) {
  const today = todayISO();
  const dueToday = tasks.filter(t => !t.archived && isToday(t.dueDate));
  const completedToday = dueToday.filter(t => t.status === 'Completed');
  const missedToday = dueToday.filter(t => t.status !== 'Completed' && t.status !== 'Cancelled');
  const todaysSessions = sessions.filter(s => s.type === 'focus' && s.completedAt.slice(0, 10) === today);
  const focusMinutes = todaysSessions.reduce((s, x) => s + x.durationMinutes, 0);
  const longestSession = todaysSessions.reduce((max, x) => Math.max(max, x.durationMinutes), 0);
  const tomorrowRecommendations = suggestTomorrowPlan(tasks, 5);
  return { completedToday, missedToday, focusMinutes, longestSession, tomorrowRecommendations };
}

/* ----- Weekly Review ----- */

function computeWeeklyReview(tasks, sessions, habits) {
  const weekSet = new Set(getWeekDates().map(toISODate));
  const weekTasks = tasks.filter(t => !t.archived);
  const completedThisWeek = weekTasks.filter(t => t.status === 'Completed' && t.completedAt && weekSet.has(t.completedAt.slice(0, 10)));
  const createdThisWeek = weekTasks.filter(t => weekSet.has(t.createdAt.slice(0, 10)));
  const overdueNow = weekTasks.filter(t => isOverdue(t.dueDate, t.status));
  const weekSessions = sessions.filter(s => s.type === 'focus' && weekSet.has(s.completedAt.slice(0, 10)));
  const focusMinutes = weekSessions.reduce((s, x) => s + x.durationMinutes, 0);
  const perf = computeWeeklyPerformance(tasks);

  const achievements = [];
  if (completedThisWeek.length >= 20) achievements.push({ icon: 'award', label: `${completedThisWeek.length} tasks completed this week` });
  if (overdueNow.length === 0 && weekTasks.length > 0) achievements.push({ icon: 'circle-check', label: 'Zero overdue tasks' });
  if (focusMinutes >= 300) achievements.push({ icon: 'target', label: `${Math.round(focusMinutes / 60)}h of focused work` });
  habits.forEach(h => { const streak = computeHabitStreak(h); if (streak >= 7) achievements.push({ icon: 'zap', label: `${h.name}: ${streak}-period streak` }); });
  if (perf.average >= 80) achievements.push({ icon: 'trending-up', label: 'Strong weekly completion rate' });

  const suggestions = [];
  if (overdueNow.length > 0) suggestions.push(`You have ${overdueNow.length} overdue task${overdueNow.length === 1 ? '' : 's'} — consider rescheduling or breaking the largest ones down.`);
  if (weekSessions.length === 0) suggestions.push('No focus sessions logged this week — try a 25-minute Pomodoro to build momentum.');
  if (perf.average < 50 && weekTasks.length > 0) suggestions.push('Completion rate dipped below 50% this week — try setting fewer, higher-priority tasks per day.');
  const neglected = detectNeglectedTasks(tasks);
  if (neglected.length > 0) suggestions.push(`${neglected.length} task${neglected.length === 1 ? ' has' : 's have'} been sitting untouched for ${5}+ days — revisit or archive ${neglected.length === 1 ? 'it' : 'them'}.`);
  if (suggestions.length === 0) suggestions.push('Solid week — keep the same rhythm going into next week.');

  return { completedThisWeek, createdThisWeek, overdueNow, focusMinutes, perf, achievements, suggestions };
}

function computeWeeklyProgress(tasks) {
  const days = [], now = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const iso = toISODate(d);
    const dayTasks = tasks.filter(t => !t.archived && t.dueDate === iso);
    const done = dayTasks.filter(t => t.status === 'Completed').length;
    const percent = dayTasks.length === 0 ? 0 : Math.round((done / dayTasks.length) * 100);
    days.push({ label: d.toLocaleDateString(undefined, { weekday: 'short' }), percent });
  }
  return days;
}

/* ----- Habit period helpers (support daily / weekly / monthly habits) ----- */

function getWeekKey(iso) {
  const week = getWeekDates(parseISODate(iso));
  return toISODate(week[0]); // Monday of that week
}
function getMonthKey(iso) { return iso.slice(0, 7); } // YYYY-MM

function habitPeriodKey(habit, iso) {
  if (habit.frequency === 'weekly') return getWeekKey(iso);
  if (habit.frequency === 'monthly') return getMonthKey(iso);
  return iso;
}

function isHabitDoneInCurrentPeriod(habit) {
  const currentKey = habitPeriodKey(habit, todayISO());
  return habit.completions.some(c => habitPeriodKey(habit, c) === currentKey);
}

function stepPeriod(date, frequency, delta) {
  const d = new Date(date);
  if (frequency === 'weekly') d.setDate(d.getDate() + delta * 7);
  else if (frequency === 'monthly') d.setMonth(d.getMonth() + delta);
  else d.setDate(d.getDate() + delta);
  return d;
}

function computeHabitStreak(habit) {
  const doneKeys = new Set(habit.completions.map(c => habitPeriodKey(habit, c)));
  let streak = 0;
  let cursor = new Date();
  while (doneKeys.has(habitPeriodKey(habit, toISODate(cursor)))) {
    streak += 1;
    cursor = stepPeriod(cursor, habit.frequency, -1);
  }
  return streak;
}

function computeHabitLongestStreak(habit) {
  const keys = Array.from(new Set(habit.completions.map(c => habitPeriodKey(habit, c))));
  if (keys.length === 0) return 0;
  if (habit.frequency === 'monthly') {
    const sorted = keys.slice().sort();
    let longest = 1, cur = 1;
    for (let i = 1; i < sorted.length; i++) {
      const [py, pm] = sorted[i - 1].split('-').map(Number);
      const [cy, cm] = sorted[i].split('-').map(Number);
      cur = (cy * 12 + cm) - (py * 12 + pm) === 1 ? cur + 1 : 1;
      longest = Math.max(longest, cur);
    }
    return longest;
  }
  const stepMs = habit.frequency === 'weekly' ? 7 * 86400000 : 86400000;
  const times = keys.map(k => parseISODate(k).getTime()).sort((a, b) => a - b);
  let longest = 1, cur = 1;
  for (let i = 1; i < times.length; i++) {
    cur = times[i] - times[i - 1] === stepMs ? cur + 1 : 1;
    longest = Math.max(longest, cur);
  }
  return longest;
}

function computeHabitCompletionPercent(habit) {
  const created = new Date(habit.createdAt);
  const now = new Date();
  const doneKeys = new Set(habit.completions.map(c => habitPeriodKey(habit, c)));
  let totalPeriods;
  if (habit.frequency === 'weekly') totalPeriods = Math.max(1, Math.floor((now - created) / (7 * 86400000)) + 1);
  else if (habit.frequency === 'monthly') totalPeriods = Math.max(1, (now.getFullYear() - created.getFullYear()) * 12 + (now.getMonth() - created.getMonth()) + 1);
  else totalPeriods = Math.max(1, Math.floor((now - created) / 86400000) + 1);
  return Math.round((doneKeys.size / totalPeriods) * 100);
}

/** Returns the last `count` periods as { label, done } for a small habit chart. */
function computeHabitHistory(habit, count = 8) {
  const doneKeys = new Set(habit.completions.map(c => habitPeriodKey(habit, c)));
  const history = [];
  let cursor = new Date();
  for (let i = 0; i < count; i++) {
    const key = habitPeriodKey(habit, toISODate(cursor));
    let label;
    if (habit.frequency === 'weekly') label = `W${Math.ceil(cursor.getDate() / 7)}`;
    else if (habit.frequency === 'monthly') label = cursor.toLocaleDateString(undefined, { month: 'short' });
    else label = cursor.toLocaleDateString(undefined, { weekday: 'narrow' });
    history.unshift({ label, done: doneKeys.has(key) });
    cursor = stepPeriod(cursor, habit.frequency, -1);
  }
  return history;
}

function createEmptyTask() {
  return {
    title: '', description: '', priority: 'Medium', status: 'Todo', category: 'Work', tags: [],
    dueDate: todayISO(), dueTime: null, estimatedMinutes: null, actualMinutes: null, notes: '',
    favorite: false, archived: false, recurring: 'none',
  };
}

const RECURRING_OPTIONS = [
  { value: 'none', label: 'Does not repeat' },
  { value: 'daily', label: 'Every day' },
  { value: 'weekdays', label: 'Every weekday' },
  { value: 'weekly', label: 'Every week' },
];
const RECURRING_MAP = Object.fromEntries(RECURRING_OPTIONS.map(r => [r.value, r]));

const WEEKDAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

/**
 * Parses freeform text like "Meeting tomorrow 3pm", "Gym every weekday",
 * "Doctor Monday 10am" into { title, dueDate, dueTime, recurring }.
 * Deterministic regex-based parsing — no network calls.
 */
function parseNaturalLanguageTask(input) {
  let text = input.trim();
  let dueDate = todayISO();
  let dueTime = null;
  let recurring = 'none';

  // Recurring phrases
  if (/\bevery\s+weekday(s)?\b/i.test(text)) {
    recurring = 'weekdays';
    text = text.replace(/\bevery\s+weekday(s)?\b/i, '');
  } else if (/\bevery\s+day\b|\bdaily\b/i.test(text)) {
    recurring = 'daily';
    text = text.replace(/\bevery\s+day\b|\bdaily\b/i, '');
  } else if (/\bevery\s+week(ly)?\b|\bweekly\b/i.test(text)) {
    recurring = 'weekly';
    text = text.replace(/\bevery\s+week(ly)?\b|\bweekly\b/i, '');
  }

  // Time — "3pm", "10:30am", "15:00"
  const timeMatch = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (timeMatch) {
    let hour, minute;
    if (timeMatch[3]) {
      hour = Number(timeMatch[1]) % 12;
      if (/pm/i.test(timeMatch[3])) hour += 12;
      minute = timeMatch[2] ? Number(timeMatch[2]) : 0;
    } else {
      hour = Number(timeMatch[1]);
      minute = Number(timeMatch[2]);
    }
    dueTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    text = text.replace(timeMatch[0], '');
  }

  // Relative day words
  if (/\btoday\b/i.test(text)) {
    dueDate = todayISO();
    text = text.replace(/\btoday\b/i, '');
  } else if (/\btomorrow\b/i.test(text)) {
    const d = new Date(); d.setDate(d.getDate() + 1);
    dueDate = toISODate(d);
    text = text.replace(/\btomorrow\b/i, '');
  } else {
    // Weekday name — "Monday", "next Friday"
    const weekdayMatch = text.match(/\b(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i);
    if (weekdayMatch) {
      const targetDay = WEEKDAY_NAMES.indexOf(weekdayMatch[2].toLowerCase());
      const d = new Date();
      let diff = (targetDay - d.getDay() + 7) % 7;
      if (diff === 0 || weekdayMatch[1]) diff = diff === 0 ? 7 : diff;
      d.setDate(d.getDate() + diff);
      dueDate = toISODate(d);
      text = text.replace(weekdayMatch[0], '');
    }
  }

  const title = text.replace(/\s{2,}/g, ' ').trim().replace(/^[-,\s]+|[-,\s]+$/g, '');

  return { title: title || input.trim(), dueDate, dueTime, recurring };
}

/* ============================== LOCAL STORAGE HOOK ============================== */

function useLocalStorage(key, initialValue) {
  const [value, setValue] = useState(() => {
    try {
      const stored = window.localStorage.getItem(key);
      return stored !== null ? JSON.parse(stored) : initialValue;
    } catch { return initialValue; }
  });
  const writeTimerRef = useRef(null);
  const latestValueRef = useRef(value);
  latestValueRef.current = value;
  useEffect(() => {
    // Debounce writes: several state updates in quick succession (drag
    // events, timer ticks) collapse into a single localStorage write.
    if (writeTimerRef.current) window.clearTimeout(writeTimerRef.current);
    writeTimerRef.current = window.setTimeout(() => {
      try { window.localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }, 150);
    return () => { if (writeTimerRef.current) window.clearTimeout(writeTimerRef.current); };
  }, [key, value]);
  // Flush any pending write immediately on unmount so nothing is lost.
  useEffect(() => () => {
    try { window.localStorage.setItem(key, JSON.stringify(latestValueRef.current)); } catch {}
  }, [key]);
  const setStoredValue = useCallback((next) => {
    setValue(prev => (typeof next === 'function' ? next(prev) : next));
  }, []);
  return [value, setStoredValue];
}

function useDelayedUnmount(isOpen, duration = 170) {
  const [shouldRender, setShouldRender] = useState(isOpen);
  useEffect(() => {
    let timer;
    if (isOpen) setShouldRender(true);
    else timer = window.setTimeout(() => setShouldRender(false), duration);
    return () => window.clearTimeout(timer);
  }, [isOpen, duration]);
  return shouldRender;
}

function Modal({ isOpen, onClose, title, children, footer, maxWidth = 'max-w-lg' }) {
  const dialogRef = useRef(null);
  const previouslyFocused = useRef(null);
  const shouldRender = useDelayedUnmount(isOpen, 170);

  useEffect(() => {
    if (!isOpen) return;
    previouslyFocused.current = document.activeElement;
    const dialog = dialogRef.current;
    const focusable = dialog?.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    focusable?.[0]?.focus();
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') { onClose(); return; }
      if (e.key === 'Tab' && focusable && focusable.length > 0) {
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', handleKeyDown);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', handleKeyDown); document.body.style.overflow = ''; previouslyFocused.current?.focus(); };
  }, [isOpen, onClose]);

  if (!shouldRender) return null;

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" role="presentation"
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={cn('absolute inset-0 bg-neutral-900/40 backdrop-blur-sm', isOpen ? 'animate-fade-in' : 'animate-fade-out')} />
      <div ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby="modal-title"
        className={cn('relative w-full rounded-2xl bg-white dark:bg-neutral-850 shadow-2xl ring-1 ring-black/5 dark:ring-white/10',
          'max-h-[90vh] flex flex-col', isOpen ? 'animate-scale-in' : 'animate-scale-out', maxWidth)}>
        <div className="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-800 px-5 py-4 shrink-0">
          <h2 id="modal-title" className="text-base font-semibold text-neutral-900 dark:text-neutral-50">{title}</h2>
          <button onClick={onClose} aria-label="Close dialog"
            className="rounded-lg p-1.5 text-neutral-400 hover:bg-neutral-100 hover:text-neutral-600 dark:hover:bg-neutral-800 dark:hover:text-neutral-300 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)]">
            <Icon name="x" size={18} />
          </button>
        </div>
        <div className="overflow-y-auto px-5 py-4 grow">{children}</div>
        {footer && <div className="flex items-center justify-end gap-2 border-t border-neutral-100 dark:border-neutral-800 px-5 py-4 shrink-0">{footer}</div>}
      </div>
    </div>, document.body
  );
}

const ProgressRing = React.memo(function ProgressRing({ percent, size = 64, strokeWidth = 6, color = 'var(--accent)', label, sublabel }) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const clamped = Math.max(0, Math.min(100, percent));
  const offset = circumference - (clamped / 100) * circumference;
  return (
    <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" strokeWidth={strokeWidth} className="stroke-neutral-100 dark:stroke-neutral-800" />
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" strokeWidth={strokeWidth} stroke={color} strokeLinecap="round"
          strokeDasharray={circumference} strokeDashoffset={offset} style={{ transition: 'stroke-dashoffset 500ms ease-out' }} />
      </svg>

        <span className="text-sm font-semibold text-neutral-900 dark:text-neutral-50">{label !== undefined ? label : `${clamped}%`}</span>

});

function TaskListSection({ tasks, emptyIcon = 'inbox', emptyTitle = 'Nothing here yet', emptyDescription = 'Tasks that match this view will show up here.', selectedTaskId, onSelect, ...actions }) {
  if (tasks.length === 0) return <EmptyState icon={emptyIcon} title={emptyTitle} description={emptyDescription} />;
  // Large lists render through a lightweight windowed view to keep the DOM
  // (and re-render cost) bounded; short lists render directly with a subtle
  // staggered entrance animation.
  if (tasks.length > 40) {
    return <VirtualizedTaskList tasks={tasks} selectedTaskId={selectedTaskId} onSelect={onSelect} actions={actions} />;
  }
  return (
    <div className="flex flex-col gap-2">
      {tasks.map((task, i) => <TaskCard key={task.id} task={task} index={i} selected={task.id === selectedTaskId} onSelect={onSelect} {...actions} />)}
    </div>
  );
}

/**
 * Minimal windowed list: renders only the task rows likely to be visible
 * (plus a buffer) inside a fixed-height scroll container, using an estimated
 * row height. Activated automatically by TaskListSection once a list grows
 * past ~40 items, which is where unconditionally rendering every TaskCard
 * starts to show up in interaction latency.
 */
function VirtualizedTaskList({ tasks, selectedTaskId, onSelect, actions }) {
  const ROW_HEIGHT = 108; // approximate TaskCard height incl. gap
  const VIEWPORT_HEIGHT = 640;
  const BUFFER = 4;
  const containerRef = useRef(null);
  const [scrollTop, setScrollTop] = useState(0);

  const totalHeight = tasks.length * ROW_HEIGHT;
  const startIndex = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER);
  const visibleCount = Math.ceil(VIEWPORT_HEIGHT / ROW_HEIGHT) + BUFFER * 2;
  const endIndex = Math.min(tasks.length, startIndex + visibleCount);
  const visibleTasks = tasks.slice(startIndex, endIndex);

  return (
    <div ref={containerRef} onScroll={(e) => setScrollTop(e.currentTarget.scrollTop)}
      style={{ maxHeight: VIEWPORT_HEIGHT, overflowY: 'auto' }} className="-mx-1 px-1">
      <div style={{ height: totalHeight, position: 'relative' }}>
        <div style={{ position: 'absolute', top: startIndex * ROW_HEIGHT, left: 0, right: 0 }} className="flex flex-col gap-2">
          {visibleTasks.map((task, i) => (
            <TaskCard key={task.id} task={task} index={i} selected={task.id === selectedTaskId} onSelect={onSelect} {...actions} />
          ))}
        </div>
      </div>
    </div>
  );
}

function SubtaskBreakdownModal({ task, onClose }) {
  const { addTask } = useTasks();
  const { pushToast } = useUI();
  const suggestions = useMemo(() => (task ? suggestSubtasks(task.title) : []), [task]);
  const [selected, setSelected] = useState({});

  useEffect(() => {
    if (task) setSelected(Object.fromEntries(suggestions.map(s => [s, true])));
  }, [task, suggestions]);

  if (!task) return null;

  const toggle = (s) => setSelected(prev => ({ ...prev, [s]: !prev[s] }));
  const selectedCount = Object.values(selected).filter(Boolean).length;

  const handleCreate = () => {
    const chosen = suggestions.filter(s => selected[s]);
    chosen.forEach(title => {
      addTask({
        ...createEmptyTask(), title, category: task.category, priority: task.priority, dueDate: task.dueDate,
        tags: [...task.tags, 'subtask'], description: `Subtask of "${task.title}"`,
      });
    });
    pushToast({ message: `Added ${chosen.length} subtask${chosen.length === 1 ? '' : 's'} for "${task.title}"` });
    onClose();
  };

  return (
    <Modal isOpen={!!task} onClose={onClose} title="Suggested subtasks" maxWidth="max-w-md" footer={
      <>
        <Button variant="ghost" size="sm" onClick={onClose}>Cancel</Button>
        <Button variant="primary" size="sm" onClick={handleCreate} disabled={selectedCount === 0}>Create {selectedCount || ''} subtask{selectedCount === 1 ? '' : 's'}</Button>
      </>
    }>
      <p className="mb-3 text-xs text-neutral-400">Based on the title "{task.title}", here's a suggested breakdown. Uncheck anything you don't need.</p>
      <div className="flex flex-col gap-1.5">
        {suggestions.map(s => (
          <label key={s} className="flex cursor-pointer items-center gap-2.5 rounded-lg border border-neutral-100 px-3 py-2 text-sm hover:bg-neutral-50 dark:border-neutral-800 dark:hover:bg-neutral-800">
            <input type="checkbox" checked={!!selected[s]} onChange={() => toggle(s)}

            <span className="text-neutral-700 dark:text-neutral-200">{s}</span>
          </label>
        ))}

    </Modal>
  );
}

const TaskContext = createContext(null);
function TaskProvider({ children }) {
  const [tasks, setTasks] = useLocalStorage(STORAGE_KEYS.tasks, []);

  const addTask = useCallback((draft) => {
    const task = { ...draft, id: generateId(), createdAt: new Date().toISOString(), completedAt: null };
    setTasks(prev => [task, ...prev]);
    return task;
  }, [setTasks]);

  const updateTask = useCallback((id, patch) => setTasks(prev => prev.map(t => t.id === id ? { ...t, ...patch } : t)), [setTasks]);
  const deleteTask = useCallback((id) => setTasks(prev => prev.filter(t => t.id !== id)), [setTasks]);

  const duplicateTask = useCallback((id) => {
    setTasks(prev => {
      const original = prev.find(t => t.id === id);
      if (!original) return prev;
      const copy = { ...original, id: generateId(), title: `${original.title} (copy)`, createdAt: new Date().toISOString(), completedAt: null, status: original.status === 'Completed' ? 'Todo' : original.status, favorite: false };
      const index = prev.findIndex(t => t.id === id);
      const next = [...prev]; next.splice(index + 1, 0, copy);
      return next;
    });
  }, [setTasks]);

  const archiveTask = useCallback((id, archived) => setTasks(prev => prev.map(t => t.id === id ? { ...t, archived } : t)), [setTasks]);
  const toggleFavorite = useCallback((id) => setTasks(prev => prev.map(t => t.id === id ? { ...t, favorite: !t.favorite } : t)), [setTasks]);
  const completeTask = useCallback((id) => setTasks(prev => prev.map(t => t.id === id ? { ...t, status: 'Completed', completedAt: new Date().toISOString() } : t)), [setTasks]);
  const undoComplete = useCallback((id) => setTasks(prev => prev.map(t => t.id === id ? { ...t, status: 'Todo', completedAt: null } : t)), [setTasks]);
  const setStatus = useCallback((id, status) => setTasks(prev => prev.map(t => t.id === id ? { ...t, status, completedAt: status === 'Completed' ? new Date().toISOString() : null } : t)), [setTasks]);

  const value = useMemo(() => ({ tasks, addTask, updateTask, deleteTask, duplicateTask, archiveTask, toggleFavorite, completeTask, undoComplete, setStatus }),
    [tasks, addTask, updateTask, deleteTask, duplicateTask, archiveTask, toggleFavorite, completeTask, undoComplete, setStatus]);

  return <TaskContext.Provider value={value}>{children}</TaskContext.Provider>;
}
function useTasks() { const ctx = useContext(TaskContext); if (!ctx) throw new Error('useTasks must be used within TaskProvider'); return ctx; }

const HabitContext = createContext(null);
function HabitProvider({ children }) {
  const [habits, setHabits] = useLocalStorage(STORAGE_KEYS.habits, []);
  const addHabit = useCallback((name, icon, color, frequency = 'daily') => {
    const habit = { id: `h_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`, name, icon, color, frequency, createdAt: new Date().toISOString(), completions: [] };
    setHabits(prev => [...prev, habit]);
  }, [setHabits]);
  const deleteHabit = useCallback((id) => setHabits(prev => prev.filter(h => h.id !== id)), [setHabits]);
  const toggleToday = useCallback((id) => {
    const today = todayISO();
    setHabits(prev => prev.map(h => {
      if (h.id !== id) return h;
      const has = h.completions.includes(today);
      return { ...h, completions: has ? h.completions.filter(d => d !== today) : [...h.completions, today] };
    }));
  }, [setHabits]);
  // For weekly/monthly habits, "today" isn't necessarily meaningful — this
  // toggles the CURRENT period (week or month) as done/undone, adding or
  // removing today's date from completions.
  const toggleCurrentPeriod = useCallback((id) => {
    const today = todayISO();
    setHabits(prev => prev.map(h => {
      if (h.id !== id) return h;
      const alreadyDone = isHabitDoneInCurrentPeriod(h);
      if (alreadyDone) {
        const currentKey = habitPeriodKey(h, today);
        return { ...h, completions: h.completions.filter(d => habitPeriodKey(h, d) !== currentKey) };
      }
      return { ...h, completions: [...h.completions, today] };
    }));
  }, [setHabits]);
  const value = useMemo(() => ({ habits, addHabit, deleteHabit, toggleToday, toggleCurrentPeriod }), [habits, addHabit, deleteHabit, toggleToday, toggleCurrentPeriod]);
  return <HabitContext.Provider value={value}>{children}</HabitContext.Provider>;
}

function getSystemPrefersDark() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function useTheme() {
  const [theme, setTheme] = useLocalStorage(STORAGE_KEYS.theme, 'system');
  useEffect(() => {
    const apply = () => {
      const isDark = theme === 'dark' || (theme === 'system' && getSystemPrefersDark());
      document.documentElement.classList.toggle('dark', isDark);
    };
    apply();
    if (theme === 'system') {
      const mql = window.matchMedia('(prefers-color-scheme: dark)');
      mql.addEventListener('change', apply);
      return () => mql.removeEventListener('change', apply);
    }
  }, [theme]);
  return { theme, setTheme };
}

function requestBrowserNotificationPermission() {
  if (!('Notification' in window)) return Promise.resolve('unsupported');
  return Notification.requestPermission();
}

function fireBrowserNotification(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch (e) { /* some browsers restrict this outside a user gesture */ }
}

/**
 * Polls once a minute for tasks that just became overdue or are due within
 * the next 30 minutes, and surfaces them as an in-app toast plus (if the
 * user opted in and granted permission) a native browser Notification.
 * Dedupes per task id for the lifetime of the tab so it doesn't repeat.
 */
function useNotificationScheduler(tasks, notificationsEnabled, pushToast) {
  const notifiedRef = useRef(new Set());
  useEffect(() => {
    const check = () => {
      const now = new Date();
      tasks.filter(t => !t.archived && t.status !== 'Completed' && t.status !== 'Cancelled' && t.dueDate).forEach(t => {
        if (notifiedRef.current.has(t.id)) return;
        if (isOverdue(t.dueDate, t.status)) {
          notifiedRef.current.add(t.id);
          pushToast({ message: `Overdue: "${t.title}"` });
          if (notificationsEnabled) fireBrowserNotification('Task overdue', t.title);
          return;
        }
        if (t.dueDate === todayISO() && t.dueTime) {
          const [h, m] = t.dueTime.split(':').map(Number);
          const due = new Date(); due.setHours(h, m, 0, 0);
          const diffMin = (due - now) / 60000;
          if (diffMin > 0 && diffMin <= 30) {
            notifiedRef.current.add(t.id);
            pushToast({ message: `"${t.title}" is due in ${Math.round(diffMin)} min` });
            if (notificationsEnabled) fireBrowserNotification('Upcoming task', `${t.title} · due at ${formatTime(t.dueTime)}`);
          }
        }
      });
    };
    check();
    const interval = window.setInterval(check, 60000);
    return () => window.clearInterval(interval);
  }, [tasks, notificationsEnabled, pushToast]);
}

function useTaskActions() {
  const { addTask, updateTask, deleteTask, duplicateTask, archiveTask, toggleFavorite, completeTask, undoComplete } = useTasks();
  const { pushToast, setTaskModalOpen, setEditingTask, setTaskModalInitialValues, setPendingDeleteTask, selectedTaskId, setSelectedTaskId } = useUI();

  const openCreate = (initialValues) => { setEditingTask(null); setTaskModalInitialValues(initialValues || null); setTaskModalOpen(true); };
  const openEdit = (task) => { setEditingTask(task); setTaskModalInitialValues(null); setTaskModalOpen(true); };

  const handleToggleComplete = (task) => {
    if (task.status === 'Completed') undoComplete(task.id);
    else { completeTask(task.id); pushToast({ message: `Completed "${task.title}"`, actionLabel: 'Undo', onAction: () => undoComplete(task.id) }); }
  };

  const handleDuplicate = (task) => { duplicateTask(task.id); pushToast({ message: `Duplicated "${task.title}"` }); };
  const handleArchive = (task) => { archiveTask(task.id, true); pushToast({ message: `Archived "${task.title}"`, actionLabel: 'Undo', onAction: () => archiveTask(task.id, false) }); };
  const handleDeleteRequest = (task) => setPendingDeleteTask(task);
  const handleToggleFavorite = (task) => toggleFavorite(task.id);
  const handleSelect = (task) => setSelectedTaskId(prev => prev === task.id ? null : task.id);

  // `dialogs` is kept as a no-op for backward compatibility with pages that
  // still render `{actions.dialogs}` — the actual modal/confirm dialog is now
  // mounted once, globally, in AppShell so keyboard shortcuts and the command
  // palette can drive it from anywhere.
  return {
    openCreate, openEdit, handleToggleComplete, handleDuplicate, handleArchive,
    toggleFavorite: handleToggleFavorite, handleDeleteRequest, dialogs: null,
    selectedTaskId, onSelect: handleSelect,
  };
}

function GlobalTaskDialogs() {
  const { addTask, updateTask, deleteTask } = useTasks();
  const { pushToast, taskModalOpen, setTaskModalOpen, editingTask, taskModalInitialValues, pendingDeleteTask, setPendingDeleteTask } = useUI();

  const handleSave = (draft) => {
    if (editingTask) { updateTask(editingTask.id, draft); pushToast({ message: `Saved "${draft.title}"` }); }
    else { addTask(draft); pushToast({ message: `Created "${draft.title}"` }); }
  };

  const confirmDelete = () => {
    if (pendingDeleteTask) { deleteTask(pendingDeleteTask.id); pushToast({ message: `Deleted "${pendingDeleteTask.title}"` }); setPendingDeleteTask(null); }
  };

  return (
    <React.Fragment>
      <TaskModal isOpen={taskModalOpen} onClose={() => setTaskModalOpen(false)} onSave={handleSave} initialTask={editingTask} prefill={taskModalInitialValues} />
      <ConfirmDialog isOpen={pendingDeleteTask !== null} title="Delete task" message={`Are you sure you want to delete "${pendingDeleteTask?.title}"? This can't be undone.`} onCancel={() => setPendingDeleteTask(null)} onConfirm={confirmDelete} />
    </React.Fragment>
  );
}

function useFilteredTasks(tasks, overrides, liveSearch = '') {
  const [filters, setFilters] = useState({ filter: 'all', category: 'All', priority: 'All', tag: 'All', search: '', sort: 'dueDate', sortDirection: 'asc', ...overrides });

            <button key={item.key} onClick={() => { onNavigate(item.key); onCloseMobile(); }} aria-current={active ? 'page' : undefined}
              title={collapsedRail ? item.label : undefined}
              className={cn('group flex min-h-[40px] items-center gap-3 rounded-lg py-2 text-sm font-medium transition-all touch-manipulation',
                collapsedRail ? 'justify-center px-0' : 'px-3',
                'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)]',
                active ? 'bg-[var(--accent)]/10 text-[var(--accent)]' : 'text-neutral-500 hover:bg-neutral-100 hover:text-neutral-800 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100')}>
              <Icon name={item.icon} size={17} className="shrink-0 transition-transform group-hover:scale-110" />
              {!collapsedRail && <span className="truncate">{item.label}</span>}
            </button>
          );
        })}
      </nav>
      <button onClick={onToggleCollapsed} aria-label={collapsedRail ? 'Expand sidebar' : 'Collapse sidebar'} aria-expanded={!collapsedRail}
        className={cn('mx-2 mb-2 hidden items-center gap-2 rounded-lg px-3 py-2 text-xs font-medium text-neutral-400 hover:bg-neutral-100 hover:text-neutral-700 dark:hover:bg-neutral-800 dark:hover:text-neutral-200 lg:flex', collapsedRail && 'justify-center px-0')}>
        <Icon name={collapsedRail ? 'chevron-right' : 'chevron-left'} size={14} />
        {!collapsedRail && 'Collapse'}
      </button>
      {!collapsedRail && <div className="px-5 py-4 text-[11px] text-neutral-400 dark:text-neutral-600">Production · v1.0</div>}
    </React.Fragment>
  );

  return (
    <React.Fragment>
      <aside className={cn('hidden lg:flex lg:shrink-0 lg:flex-col lg:border-r lg:border-neutral-100 lg:dark:border-neutral-800 lg:bg-white lg:dark:bg-neutral-900',
        'transition-[width] duration-300 ease-in-out', collapsed ? 'lg:w-[68px]' : 'lg:w-60')}>
        {content(collapsed)}
      </aside>
      {mobileShouldRender && (
        <div className="fixed inset-0 z-40 lg:hidden" role="dialog" aria-modal="true">
          <div className={cn('absolute inset-0 bg-neutral-900/40', mobileOpen ? 'animate-fade-in' : 'animate-fade-out')} onClick={onCloseMobile} />
          <aside className={cn('relative flex h-full w-64 flex-col bg-white dark:bg-neutral-900', mobileOpen ? 'animate-slide-in' : 'animate-slide-out')}>{content(false)}</aside>
        </div>
      )}
    </React.Fragment>
  );
}

function ReminderBanner({ tasks, onOpenTask }) {
  const { dismissedReminderKey, setDismissedReminderKey, setPage } = useUI();
  const reminder = useMemo(() => getUrgentReminder(tasks), [tasks]);
  if (!reminder) return null;
  const key = `${reminder.level}:${reminder.task.id}`;
  if (dismissedReminderKey === key) return null;

  const isOverdueLevel = reminder.level === 'overdue';
  return (
    <div role="status" aria-live="polite"
      className={cn('animate-banner-in flex items-center gap-3 px-4 py-2.5 text-sm sm:px-6',
        isOverdueLevel ? 'bg-red-50 text-red-700 dark:bg-red-500/10 dark:text-red-300' : 'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300')}>
      <Icon name={isOverdueLevel ? 'alert-triangle' : 'bell'} size={15} className="shrink-0" />
      <span className="flex-1 truncate">{reminder.message}</span>
      <button onClick={() => { onOpenTask(reminder.task); setPage(isOverdueLevel ? 'today' : 'today'); }} className="shrink-0 font-medium underline underline-offset-2">
        View
      </button>
      <button onClick={() => setDismissedReminderKey(key)} aria-label="Dismiss reminder" className="shrink-0 rounded p-0.5 hover:bg-black/5 dark:hover:bg-white/10">
        <Icon name="x" size={14} />
      </button>
    </div>
  );
}

/* ============================== COMMAND PALETTE ============================== */

function CommandPalette() {
  const { commandPaletteOpen, setCommandPaletteOpen, setPage, pushToast } = useUI();
  const { tasks, addTask } = useTasks();
  const { theme, setTheme } = useTheme();
  const actions = useTaskActions();
  const [query, setQuery] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    if (commandPaletteOpen) { setQuery(''); setTimeout(() => inputRef.current?.focus(), 30); }
  }, [commandPaletteOpen]);

  if (!commandPaletteOpen) return null;

  const close = () => setCommandPaletteOpen(false);

  const staticCommands = [
    { id: 'nav-dashboard', label: 'Go to Dashboard', icon: 'layout-grid', run: () => setPage('dashboard') },
    { id: 'nav-today', label: 'Go to Today', icon: 'sun', run: () => setPage('today') },
    { id: 'nav-upcoming', label: 'Go to Upcoming', icon: 'calendar-clock', run: () => setPage('upcoming') },
    { id: 'nav-calendar', label: 'Go to Calendar', icon: 'calendar', run: () => setPage('calendar') },
    { id: 'nav-kanban', label: 'Go to Kanban', icon: 'columns', run: () => setPage('kanban') },
    { id: 'nav-focus', label: 'Go to Focus (Pomodoro)', icon: 'target', run: () => setPage('focus') },
    { id: 'nav-habits', label: 'Go to Habits', icon: 'repeat', run: () => setPage('habits') },
    { id: 'nav-analytics', label: 'Go to Analytics', icon: 'bar-chart', run: () => setPage('analytics') },
    { id: 'open-settings', label: 'Open Settings', icon: 'settings', run: () => setPage('settings') },
    { id: 'new-task', label: 'Create new task', icon: 'plus', run: () => actions.openCreate() },
    { id: 'toggle-theme', label: `Toggle theme (currently ${theme})`, icon: THEME_ICON[theme], run: () => setTheme(theme === 'dark' ? 'light' : theme === 'light' ? 'system' : 'dark') },
  ];

  const q = query.trim().toLowerCase();
  const matchingCommands = q ? staticCommands.filter(c => c.label.toLowerCase().includes(q)) : staticCommands;
  const matchingTasks = q ? tasks.filter(t => !t.archived && matchesSearch(t, q)).slice(0, 6) : [];

  const runCommand = (fn) => { fn(); close(); };

  const handleCreateFromQuery = () => {
    if (!q) return;
    const parsed = parseNaturalLanguageTask(query);
    addTask({ ...createEmptyTask(), ...parsed });
    pushToast({ message: `Created "${parsed.title}"` });
    close();
  };

  return (
    <Modal isOpen={commandPaletteOpen} onClose={close} title="Command palette" maxWidth="max-w-lg">
      <div className="flex flex-col gap-3 -mt-1">
        <div className="relative">
          <Icon name="search" size={15} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
          <input ref={inputRef} value={query} onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && matchingCommands.length === 0 && matchingTasks.length === 0) handleCreateFromQuery(); }}
            placeholder="Search, navigate, or type to create a task…" className={inputClasses + ' pl-9'} />
        </div>
        <div className="flex max-h-80 flex-col gap-1 overflow-y-auto">
          {matchingCommands.length === 0 && matchingTasks.length === 0 && q && (
            <button onClick={handleCreateFromQuery} className="flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-sm text-neutral-700 hover:bg-neutral-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
              <Icon name="plus" size={15} className="text-indigo-500" />
              Create task: <span className="font-medium">"{query}"</span>
            </button>
          )}
          {matchingCommands.map(c => (
            <button key={c.id} onClick={() => runCommand(c.run)} className="flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-sm text-neutral-700 hover:bg-neutral-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
              <Icon name={c.icon} size={15} className="text-neutral-400" />
              {c.label}
            </button>
          ))}
          {matchingTasks.length > 0 && (
            <React.Fragment>
              <p className="mt-1 px-2.5 text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Tasks</p>
              {matchingTasks.map(t => (
                <button key={t.id} onClick={() => runCommand(() => actions.openEdit(t))} className="flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-sm text-neutral-700 hover:bg-neutral-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
                  <span className="h-2 w-2 shrink-0 rounded-full" style={{ backgroundColor: PRIORITY_MAP[t.priority].color }} />
                  <span className="truncate">{t.title}</span>
                </button>
              ))}
            </React.Fragment>
          )}
        </div>
        <div className="flex flex-wrap items-center gap-3 border-t border-neutral-100 pt-3 text-[11px] text-neutral-400 dark:border-neutral-800">
          <span><kbd className="rounded border border-neutral-200 px-1 dark:border-neutral-700">N</kbd> new task</span>
          <span><kbd className="rounded border border-neutral-200 px-1 dark:border-neutral-700">Space</kbd> complete selected</span>
          <span><kbd className="rounded border border-neutral-200 px-1 dark:border-neutral-700">Del</kbd> delete selected</span>
          <span><kbd className="rounded border border-neutral-200 px-1 dark:border-neutral-700">Ctrl</kbd>+<kbd className="rounded border border-neutral-200 px-1 dark:border-neutral-700">/</kbd> search</span>
        </div>
      </div>
    </Modal>
  );
}

function NaturalLanguageQuickAdd() {
  const { addTask } = useTasks();
  const { pushToast } = useUI();
  const [value, setValue] = useState('');
  const preview = value.trim() ? parseNaturalLanguageTask(value) : null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!value.trim()) return;
    const parsed = parseNaturalLanguageTask(value);
    addTask({ ...createEmptyTask(), ...parsed });
    pushToast({ message: `Created "${parsed.title}"` });
    setValue('');
  };

  return (
    <form onSubmit={handleSubmit} className="flex flex-col gap-1.5 rounded-2xl border border-neutral-100 bg-white p-3 dark:border-neutral-800 dark:bg-neutral-850 sm:flex-row sm:items-center">
      <div className="relative flex-1">
        <Icon name="plus" size={15} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
        <input value={value} onChange={(e) => setValue(e.target.value)}
          placeholder='Try "Meeting tomorrow 3pm" or "Gym every weekday"' aria-label="Quick add task using natural language"
          className="h-9 w-full rounded-lg border-none bg-transparent pl-9 pr-3 text-sm text-neutral-800 placeholder:text-neutral-400 outline-none dark:text-neutral-100" />
      </div>
      {preview && (
        <div className="flex flex-wrap items-center gap-1.5 px-1 text-[11px] text-neutral-400 sm:px-0">
          <Badge label={formatFriendlyDate(preview.dueDate)} color="#5B5FEF" bg="#5B5FEF14" icon={<Icon name="calendar" size={10} />} />
          {preview.dueTime && <Badge label={formatTime(preview.dueTime)} color="#2563EB" bg="#2563EB14" icon={<Icon name="clock" size={10} />} />}
          {preview.recurring !== 'none' && <Badge label={RECURRING_MAP[preview.recurring].label} color="#8B5CF6" bg="#8B5CF614" icon={<Icon name="repeat" size={10} />} />}

        <div className="flex flex-wrap items-center justify-around gap-4">

function Upcoming() {
  const { tasks } = useTasks();
  const { searchQuery } = useUI();
  const actions = useTaskActions();
  const [range, setRange] = useState(7);
  const [filters, setFilters] = useState({ filter: 'pending', category: 'All', priority: 'All', tag: 'All', sort: 'dueDate', sortDirection: 'asc' });
  const allTags = useMemo(() => getAllTags(tasks), [tasks]);

  const groups = useMemo(() => {
    const today = parseISODate(todayISO()).getTime();
    const end = today + range * 86400000;
    const inRange = tasks.filter(t => t.dueDate && parseISODate(t.dueDate).getTime() >= today && parseISODate(t.dueDate).getTime() <= end);
    const filtered = sortTasks(applyFilters(inRange, { ...filters, search: searchQuery }), filters.sort, filters.sortDirection);
    const map = new Map();
    filtered.forEach(task => { const key = task.dueDate; if (!map.has(key)) map.set(key, []); map.get(key).push(task); });
    return Array.from(map.entries());
  }, [tasks, searchQuery, range, filters]);

  const listProps = {
    onEdit: actions.openEdit, onToggleComplete: actions.handleToggleComplete, onDelete: actions.handleDeleteRequest,
    onDuplicate: actions.handleDuplicate, onToggleFavorite: actions.toggleFavorite, onArchive: actions.handleArchive,
    selectedTaskId: actions.selectedTaskId, onSelect: actions.onSelect,
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Upcoming</h1>
          <p className="text-sm text-neutral-400 dark:text-neutral-500">Everything ahead, grouped by date.</p>
        </div>
        <Button variant="primary" onClick={() => actions.openCreate()}><Icon name="plus" size={16} />New task</Button>
      </div>

      <div className="flex gap-1 rounded-lg bg-neutral-100 p-1 dark:bg-neutral-800 self-start">
        {[{ v: 7, label: 'Next 7 Days' }, { v: 30, label: 'Next 30 Days' }].map(opt => (
          <button key={opt.v} onClick={() => setRange(opt.v)} aria-pressed={range === opt.v}
            className={cn('rounded-md px-3 py-1.5 text-xs font-medium transition-colors',
              range === opt.v ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-white' : 'text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200')}>
            {opt.label}
          </button>
        ))}
      </div>

      <TaskToolbar filters={filters} onChange={(patch) => setFilters(f => ({ ...f, ...patch }))} allTags={allTags} />

      {groups.length === 0 ? (
        <TaskListSection tasks={[]} emptyTitle="Nothing scheduled" emptyDescription="Tasks with a future due date will appear here, grouped by day." emptyIcon="calendar-clock" {...listProps} />
      ) : (
        <div className="flex flex-col gap-6">
          {groups.map(([date, groupTasks]) => (
            <div key={date}>
              <h2 className="mb-2 text-xs font-semibold uppercase tracking-wide text-neutral-400 dark:text-neutral-500">{formatFriendlyDate(date)}</h2>
              <TaskListSection tasks={groupTasks} {...listProps} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Calendar() {
  const { tasks, updateTask } = useTasks();
  const actions = useTaskActions();
  const [view, setView] = useState('month');
  const [cursor, setCursor] = useState(() => new Date());
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [dragTaskId, setDragTaskId] = useState(null);
  const [dragOverDate, setDragOverDate] = useState(null);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const matrix = useMemo(() => getMonthMatrix(year, month), [year, month]);
  const weekDates = useMemo(() => getWeekDates(cursor), [cursor]);

  const tasksByDate = useMemo(() => {
    const map = new Map();
    tasks.filter(t => !t.archived && t.dueDate).forEach(t => { const key = t.dueDate; if (!map.has(key)) map.set(key, []); map.get(key).push(t); });
    return map;
  }, [tasks]);
  const selectedTasks = tasksByDate.get(selectedDate) ?? [];

  const moveTaskToDate = (taskId, iso) => { if (taskId) updateTask(taskId, { dueDate: iso }); };

  const goPrev = () => {
    if (view === 'month') setCursor(new Date(year, month - 1, 1));
    else if (view === 'week') { const d = new Date(cursor); d.setDate(d.getDate() - 7); setCursor(d); }
    else { const d = new Date(cursor); d.setDate(d.getDate() - 1); setCursor(d); }
  };
  const goNext = () => {
    if (view === 'month') setCursor(new Date(year, month + 1, 1));
    else if (view === 'week') { const d = new Date(cursor); d.setDate(d.getDate() + 7); setCursor(d); }
    else { const d = new Date(cursor); d.setDate(d.getDate() + 1); setCursor(d); }
  };
  const goToday = () => { setCursor(new Date()); setSelectedDate(todayISO()); };

  const headerLabel = view === 'month' ? cursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })
    : view === 'week' ? `${weekDates[0].toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${weekDates[6].toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`
    : cursor.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  const dayTasksFor = (iso) => tasksByDate.get(iso) ?? [];

  const listProps = {
    onEdit: actions.openEdit, onToggleComplete: actions.handleToggleComplete, onDelete: actions.handleDeleteRequest,
    onDuplicate: actions.handleDuplicate, onToggleFavorite: actions.toggleFavorite, onArchive: actions.handleArchive,
    selectedTaskId: actions.selectedTaskId, onSelect: actions.onSelect,
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Calendar</h1>
          <p className="text-sm text-neutral-400 dark:text-neutral-500">{headerLabel}</p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="flex gap-1 rounded-lg bg-neutral-100 p-1 dark:bg-neutral-800">
            {['month', 'week', 'day'].map(v => (
              <button key={v} onClick={() => setView(v)} aria-pressed={view === v}
                className={cn('rounded-md px-2.5 py-1 text-xs font-medium capitalize transition-colors',
                  view === v ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-white' : 'text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200')}>
                {v}
              </button>
            ))}
          </div>
          <Button variant="secondary" size="icon" aria-label="Previous" onClick={goPrev}><Icon name="chevron-left" size={16} /></Button>
          <Button variant="secondary" size="sm" onClick={goToday}>Today</Button>
          <Button variant="secondary" size="icon" aria-label="Next" onClick={goNext}><Icon name="chevron-right" size={16} /></Button>
          <Button variant="primary" onClick={() => actions.openCreate({ dueDate: view === 'day' ? toISODate(cursor) : selectedDate })}><Icon name="plus" size={16} />New task</Button>
        </div>
      </div>

      {view === 'month' && (
        <div className="grid grid-cols-1 gap-5 lg:grid-cols-3">
          <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850 lg:col-span-2">
            <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-neutral-400">
              {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => <div key={d} className="py-2">{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {matrix.flat().map((date, i) => {
                if (!date) return <div key={i} className="aspect-square" />;
                const iso = toISODate(date);
                const dayTasks = dayTasksFor(iso);
                const isSelected = iso === selectedDate;
                const isTodayCell = iso === todayISO();
                const isDragOver = dragOverDate === iso;
                return (
                  <div key={iso}
                    onDragOver={(e) => { e.preventDefault(); setDragOverDate(iso); }}
                    onDragLeave={() => setDragOverDate(d => d === iso ? null : d)}
                    onDrop={(e) => { e.preventDefault(); moveTaskToDate(e.dataTransfer.getData('text/plain') || dragTaskId, iso); setDragOverDate(null); setDragTaskId(null); }}
                    className="group relative aspect-square">
                    <button onClick={() => setSelectedDate(iso)} aria-pressed={isSelected}
                      aria-label={`${date.toDateString()}${dayTasks.length ? `, ${dayTasks.length} tasks` : ''}`}
                      className={cn('flex h-full w-full flex-col items-center justify-start gap-1 rounded-lg border p-1.5 text-xs transition-colors',
                        'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)]',
                        isDragOver ? 'border-[var(--accent)] bg-[var(--accent)]/10' :
                        isSelected ? 'border-[var(--accent)] bg-[var(--accent)]/10' : 'border-transparent hover:bg-neutral-50 dark:hover:bg-neutral-800')}>
                      <span className={cn('flex h-5 w-5 items-center justify-center rounded-full font-medium', isTodayCell && 'bg-[var(--accent)] text-white', !isTodayCell && 'text-neutral-600 dark:text-neutral-300')}>{date.getDate()}</span>
                      <div className="flex flex-wrap justify-center gap-0.5">
                        {dayTasks.slice(0, 4).map(t => (
                          <span key={t.id} draggable
                            onDragStart={(e) => { e.stopPropagation(); e.dataTransfer.setData('text/plain', t.id); setDragTaskId(t.id); }}
                            className="h-1.5 w-1.5 cursor-grab rounded-full" style={{ backgroundColor: PRIORITY_MAP[t.priority].color }} title={t.title} />
                        ))}
                      </div>
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); actions.openCreate({ dueDate: iso }); }} aria-label={`Add task on ${date.toDateString()}`}
                      className="absolute right-0.5 top-0.5 flex h-4 w-4 items-center justify-center rounded bg-white text-neutral-400 opacity-0 shadow-sm transition-opacity hover:text-[var(--accent)] group-hover:opacity-100 dark:bg-neutral-700 dark:text-neutral-300">
                      <Icon name="plus" size={10} strokeWidth={3} />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850">
            <h2 className="mb-3 text-sm font-semibold text-neutral-700 dark:text-neutral-200">
              {new Date(selectedDate + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}
            </h2>
            <TaskListSection tasks={selectedTasks} emptyTitle="No tasks" emptyDescription="Nothing scheduled for this day." emptyIcon="calendar" {...listProps} />
          </div>
        </div>
      )}

      {view === 'week' && (
        <div className="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-7">
          {weekDates.map(date => {
            const iso = toISODate(date);
            const dayTasks = dayTasksFor(iso);
            const isTodayCell = iso === todayISO();
            const isDragOver = dragOverDate === iso;
            return (
              <div key={iso}
                onDragOver={(e) => { e.preventDefault(); setDragOverDate(iso); }}
                onDragLeave={() => setDragOverDate(d => d === iso ? null : d)}
                onDrop={(e) => { e.preventDefault(); moveTaskToDate(e.dataTransfer.getData('text/plain') || dragTaskId, iso); setDragOverDate(null); setDragTaskId(null); }}
                className={cn('group flex min-h-[200px] flex-col gap-2 rounded-2xl border p-3 transition-colors',
                  isDragOver ? 'border-[var(--accent)] bg-[var(--accent)]/5' : 'border-neutral-100 bg-white dark:border-neutral-800 dark:bg-neutral-850')}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className="text-[11px] font-semibold uppercase tracking-wide text-neutral-400">{date.toLocaleDateString(undefined, { weekday: 'short' })}</p>
                    <p className={cn('text-sm font-semibold', isTodayCell ? 'text-[var(--accent)]' : 'text-neutral-800 dark:text-neutral-100')}>{date.getDate()}</p>
                  </div>
                  <button onClick={() => actions.openCreate({ dueDate: iso })} aria-label={`Add task on ${date.toDateString()}`}
                    className="flex h-5 w-5 items-center justify-center rounded text-neutral-400 opacity-0 transition-opacity hover:text-[var(--accent)] group-hover:opacity-100">
                    <Icon name="plus" size={12} strokeWidth={3} />
                  </button>
                </div>
                <div className="flex flex-col gap-1">
                  {dayTasks.map(t => <CalendarTaskChip key={t.id} task={t} onEdit={actions.openEdit} onDragStartId={setDragTaskId} />)}
                  {dayTasks.length === 0 && <p className="rounded-md border border-dashed border-neutral-200 py-4 text-center text-[11px] text-neutral-400 dark:border-neutral-700">No tasks</p>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {view === 'day' && (
        <div className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
          <TaskListSection tasks={sortTasks(dayTasksFor(toISODate(cursor)), 'dueDate', 'asc')}
            emptyTitle="Nothing scheduled" emptyDescription="Nothing due on this day yet." emptyIcon="calendar-clock" {...listProps} />
        </div>
      )}
    </div>
  );
}
