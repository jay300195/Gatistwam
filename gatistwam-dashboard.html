  const { searchQuery } = useUI();
  const actions = useTaskActions();
  const [dragTaskId, setDragTaskId] = useState(null);
  const [dragOverStatus, setDragOverStatus] = useState(null);

  const columns = useMemo(() => {
    const visible = tasks.filter(t => !t.archived && matchesSearch(t, searchQuery));
    const map = new Map();
    KANBAN_STATUSES.forEach(s => map.set(s, []));
    visible.forEach(t => { if (KANBAN_STATUSES.includes(t.status)) map.get(t.status).push(t); });
    return map;
  }, [tasks, searchQuery]);

  const moveTask = (taskId, status) => setStatus(taskId, status);

  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Kanban</h1>
          <p className="text-sm text-neutral-400 dark:text-neutral-500">Drag cards or use the arrows to change status.</p>
        </div>
        <Button variant="primary" onClick={actions.openCreate}><Icon name="plus" size={16} />New task</Button>
      </div>
      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        {KANBAN_STATUSES.map(status => {
          const meta = STATUS_MAP[status];
          const columnTasks = columns.get(status) ?? [];
          const isOver = dragOverStatus === status;
          return (
            <div key={status}
              onDragOver={(e) => { e.preventDefault(); setDragOverStatus(status); }}
              onDragLeave={() => setDragOverStatus(s => s === status ? null : s)}
              onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain') || dragTaskId; if (id) moveTask(id, status); setDragOverStatus(null); setDragTaskId(null); }}
              className={cn('flex min-h-[200px] flex-col gap-2 rounded-2xl border p-3 transition-all duration-200',
                isOver ? 'border-[var(--accent)] bg-[var(--accent)]/5 scale-[1.01]' : 'border-neutral-100 bg-neutral-50/60 dark:border-neutral-800 dark:bg-neutral-900/40')}>
              <div className="flex items-center justify-between px-1">
                <span className="flex items-center gap-1.5 text-sm font-semibold text-neutral-700 dark:text-neutral-200">
                  <span className="h-2 w-2 rounded-full" style={{ backgroundColor: meta.color }} />{meta.label}
                </span>
                <span className="text-xs font-medium text-neutral-400">{columnTasks.length}</span>
              </div>
              <div className="flex flex-col gap-2">
                {columnTasks.map(task => {
                  const currentIndex = KANBAN_STATUSES.indexOf(status);
                  return (
                    <div key={task.id} draggable
                      onDragStart={(e) => { e.dataTransfer.setData('text/plain', task.id); setDragTaskId(task.id); }}
                      onDragEnd={() => setDragTaskId(null)}
                      className="group cursor-grab animate-scale-in rounded-xl border border-neutral-100 bg-white p-3 shadow-sm transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 active:cursor-grabbing dark:border-neutral-800 dark:bg-neutral-850"
                      style={{ borderLeftWidth: 3, borderLeftColor: PRIORITY_MAP[task.priority].color }}>
                      <button onClick={() => actions.openEdit(task)} className="w-full text-left text-sm font-medium text-neutral-800 hover:text-[var(--accent)] dark:text-neutral-100 focus-visible:outline-none focus-visible:underline">{task.title}</button>
                      {task.dueDate && <p className="mt-1 text-xs text-neutral-400">{formatFriendlyDate(task.dueDate)}</p>}
                      <div className="mt-2 flex items-center justify-between">
                        <span className="text-[11px] text-neutral-400">{task.category}</span>
                        <div className="flex items-center gap-0.5 opacity-100 transition-opacity md:opacity-0 md:group-hover:opacity-100">
                          <button disabled={currentIndex === 0} onClick={() => moveTask(task.id, KANBAN_STATUSES[currentIndex - 1])} aria-label="Move to previous status" className="touch-manipulation rounded p-1.5 text-neutral-400 hover:bg-neutral-100 disabled:opacity-20 dark:hover:bg-neutral-800"><Icon name="chevron-left" size={13} /></button>
                          <button disabled={currentIndex === KANBAN_STATUSES.length - 1} onClick={() => moveTask(task.id, KANBAN_STATUSES[currentIndex + 1])} aria-label="Move to next status" className="touch-manipulation rounded p-1.5 text-neutral-400 hover:bg-neutral-100 disabled:opacity-20 dark:hover:bg-neutral-800"><Icon name="chevron-right" size={13} /></button>
                        </div>
                      </div>
                    </div>
                  );
                })}
                {columnTasks.length === 0 && <p className="rounded-lg border border-dashed border-neutral-200 py-6 text-center text-xs text-neutral-400 dark:border-neutral-700">Drop tasks here</p>}
              </div>
            </div>
          );
        })}
      </div>
      {actions.dialogs}
    </div>
  );
}

function formatTimer(totalSeconds) {
  const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

const FOCUS_MODES = [
  { key: 'focus', label: 'Focus', icon: 'target', accent: '#5B5FEF' },
  { key: 'short-break', label: 'Short Break', icon: 'coffee', accent: '#10B981' },
  { key: 'long-break', label: 'Long Break', icon: 'coffee', accent: '#06B6D4' },
];

function Focus() {
  const { settings, setSettings, sessions, logSession } = usePomodoro();
  const { tasks } = useTasks();
  const { focusMode, setFocusMode, pushToast } = useUI();

  const [mode, setModeState] = useState('focus');
  const durationMinutesForMode = (m) => m === 'focus' ? settings.focusMinutes : m === 'short-break' ? settings.shortBreakMinutes : settings.longBreakMinutes;
  const [secondsLeft, setSecondsLeft] = useState(() => durationMinutesForMode('focus') * 60);
  const [isRunning, setIsRunning] = useState(false);
  const [associatedTaskId, setAssociatedTaskId] = useState('');
  const [focusCycleCount, setFocusCycleCount] = useState(0);
  const intervalRef = useRef(null);
  const modeRef = useRef(mode);
  const associatedTaskIdRef = useRef(associatedTaskId);
  const focusCycleCountRef = useRef(focusCycleCount);
  useEffect(() => { modeRef.current = mode; }, [mode]);
  useEffect(() => { associatedTaskIdRef.current = associatedTaskId; }, [associatedTaskId]);
  useEffect(() => { focusCycleCountRef.current = focusCycleCount; }, [focusCycleCount]);

  const setMode = (m) => { setModeState(m); setIsRunning(false); setSecondsLeft(durationMinutesForMode(m) * 60); };

  const handleSessionComplete = useCallback(() => {
    const finishedMode = modeRef.current;
    const finishedMinutes = durationMinutesForMode(finishedMode);
    const task = associatedTaskIdRef.current ? tasks.find(t => t.id === associatedTaskIdRef.current) : null;
    logSession(finishedMode === 'focus' ? 'focus' : finishedMode, finishedMinutes, associatedTaskIdRef.current || null, task ? task.title : null);
    pushToast({ message: finishedMode === 'focus' ? `Focus session complete${task ? ` — ${task.title}` : ''}!` : 'Break complete. Ready to focus?' });

    if (finishedMode === 'focus') {
      const nextCount = focusCycleCountRef.current + 1;
      setFocusCycleCount(nextCount);
      const nextMode = nextCount % settings.sessionsUntilLongBreak === 0 ? 'long-break' : 'short-break';
      setModeState(nextMode);
      setSecondsLeft(durationMinutesForMode(nextMode) * 60);
    } else {
      setModeState('focus');
      setSecondsLeft(durationMinutesForMode('focus') * 60);
    }
    setIsRunning(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tasks, logSession, settings, pushToast]);

  useEffect(() => {
    if (!isRunning) return;
    intervalRef.current = window.setInterval(() => {
      setSecondsLeft(s => {
        if (s <= 1) {
          window.clearInterval(intervalRef.current);
          handleSessionComplete();
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => window.clearInterval(intervalRef.current);
  }, [isRunning, handleSessionComplete]);

  useEffect(() => () => window.clearInterval(intervalRef.current), []);

  const totalSeconds = durationMinutesForMode(mode) * 60;
  const progressPercent = Math.round(((totalSeconds - secondsLeft) / totalSeconds) * 100);
  const currentModeMeta = FOCUS_MODES.find(m => m.key === mode);
  const associatedTask = tasks.find(t => t.id === associatedTaskId) || null;
  const availableTasks = useMemo(() => tasks.filter(t => !t.archived && t.status !== 'Completed' && t.status !== 'Cancelled'), [tasks]);
  const stats = useMemo(() => computeFocusStats(sessions), [sessions]);

  const handleReset = () => { setIsRunning(false); setSecondsLeft(durationMinutesForMode(mode) * 60); };
  const handleSkip = () => {
    window.clearInterval(intervalRef.current);
    if (mode === 'focus') {
      const nextMode = (focusCycleCount + 1) % settings.sessionsUntilLongBreak === 0 ? 'long-break' : 'short-break';
      setMode(nextMode);
    } else {
      setMode('focus');
    }
  };

  const timerDisplay = (
    <div className="flex flex-col items-center">
      <div className="relative flex items-center justify-center" style={{ width: 260, height: 260 }}>
        <svg width={260} height={260} className="-rotate-90">
          <circle cx={130} cy={130} r={118} fill="none" strokeWidth={10} className="stroke-neutral-100 dark:stroke-neutral-800" />
          <circle cx={130} cy={130} r={118} fill="none" strokeWidth={10} stroke={currentModeMeta.accent} strokeLinecap="round"
            strokeDasharray={2 * Math.PI * 118} strokeDashoffset={2 * Math.PI * 118 * (1 - progressPercent / 100)}
            style={{ transition: 'stroke-dashoffset 500ms linear' }} />
        </svg>
        <div className="absolute flex flex-col items-center">
          <span className="text-5xl font-semibold tabular-nums tracking-tight text-neutral-900 dark:text-neutral-50">{formatTimer(secondsLeft)}</span>
          <span className="mt-1 text-sm font-medium" style={{ color: currentModeMeta.accent }}>{currentModeMeta.label}</span>
        </div>
      </div>

      {associatedTask && (
        <div className="mt-4 flex items-center gap-2 rounded-full bg-neutral-100 px-3 py-1.5 text-sm text-neutral-600 dark:bg-neutral-800 dark:text-neutral-300">
          <Icon name="target" size={13} />{associatedTask.title}
        </div>
      )}

      <div className="mt-6 flex items-center gap-2">
        {!isRunning ? (
          <Button variant="primary" size="md" onClick={() => setIsRunning(true)}><Icon name="play" size={16} />{secondsLeft === totalSeconds ? 'Start' : 'Resume'}</Button>
        ) : (
          <Button variant="secondary" size="md" onClick={() => setIsRunning(false)}><Icon name="pause" size={16} />Pause</Button>
        )}
        <Button variant="ghost" size="md" onClick={handleReset}><Icon name="undo" size={16} />Reset</Button>
        <Button variant="ghost" size="md" onClick={handleSkip}><Icon name="skip-forward" size={16} />Skip</Button>
      </div>
    </div>
  );

  if (focusMode) {
    return (
      <div className="fixed inset-0 z-40 flex flex-col items-center justify-center bg-neutral-50 dark:bg-neutral-900">
        <button onClick={() => setFocusMode(false)} aria-label="Exit focus mode"
          className="absolute right-6 top-6 flex items-center gap-1.5 rounded-lg border border-neutral-200 px-3 py-1.5 text-xs font-medium text-neutral-500 hover:bg-neutral-100 dark:border-neutral-700 dark:text-neutral-400 dark:hover:bg-neutral-800">
          <Icon name="minimize" size={13} />Exit focus mode
        </button>
        {timerDisplay}
        <p className="mt-8 text-xs text-neutral-400">{stats.todayCount} focus session{stats.todayCount === 1 ? '' : 's'} today</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Focus</h1>
          <p className="text-sm text-neutral-400 dark:text-neutral-500">Pomodoro timer to help you stay in flow.</p>
        </div>
        <Button variant="secondary" onClick={() => setFocusMode(true)}><Icon name="maximize" size={15} />Enter focus mode</Button>
      </div>

      <div className="grid grid-cols-2 gap-4 sm:grid-cols-4">
        <StatCard label="Today's Sessions" value={stats.todayCount} icon="target" accent="var(--accent)" />
        <StatCard label="Weekly Sessions" value={stats.weekCount} icon="calendar-clock" accent="#2563EB" />
        <StatCard label="Total Focus Time" value={Math.floor(stats.totalMinutes / 60)} suffix="h" icon="clock" accent="#059669" trend={`${stats.totalMinutes} min total`} />
        <StatCard label="All-time Sessions" value={stats.totalSessions} icon="award" accent="#D97706" />
      </div>

      <div className="rounded-2xl border border-neutral-100 bg-white p-6 dark:border-neutral-800 dark:bg-neutral-850">
        <div className="mb-6 flex justify-center gap-1 rounded-lg bg-neutral-100 p-1 dark:bg-neutral-800">
          {FOCUS_MODES.map(m => (
            <button key={m.key} onClick={() => setMode(m.key)} aria-pressed={mode === m.key}
              className={cn('flex items-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-medium transition-colors',
                mode === m.key ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-white' : 'text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200')}>
              <Icon name={m.icon} size={13} />{m.label}
            </button>
          ))}
        </div>

        <div className="flex justify-center">{timerDisplay}</div>

        <div className="mx-auto mt-6 max-w-xs">
          <FormField label="Associate with task" htmlFor="focus-task">
            <select id="focus-task" className={selectClasses} value={associatedTaskId} onChange={(e) => setAssociatedTaskId(e.target.value)}>
              <option value="">No task selected</option>
              {availableTasks.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
            </select>
          </FormField>
        </div>

        <div className="mx-auto mt-6 grid max-w-sm grid-cols-3 gap-3">
          <FormField label="Focus (min)" htmlFor="focus-minutes">
            <input id="focus-minutes" type="number" min={1} className={inputClasses} value={settings.focusMinutes}
              onChange={(e) => setSettings(s => ({ ...s, focusMinutes: Math.max(1, Number(e.target.value) || 1) }))} />
          </FormField>
          <FormField label="Short break" htmlFor="short-break-minutes">
            <input id="short-break-minutes" type="number" min={1} className={inputClasses} value={settings.shortBreakMinutes}
              onChange={(e) => setSettings(s => ({ ...s, shortBreakMinutes: Math.max(1, Number(e.target.value) || 1) }))} />
          </FormField>
          <FormField label="Long break" htmlFor="long-break-minutes">
            <input id="long-break-minutes" type="number" min={1} className={inputClasses} value={settings.longBreakMinutes}
              onChange={(e) => setSettings(s => ({ ...s, longBreakMinutes: Math.max(1, Number(e.target.value) || 1) }))} />
          </FormField>
        </div>
      </div>
    </div>
  );
}

const HABIT_COLORS = ['#5B5FEF', '#10B981', '#F59E0B', '#EF4444', '#06B6D4', '#EC4899', '#8B5CF6'];
const HABIT_ICONS = ['💧', '📖', '🏃', '🧘', '😴', '🥗', '✍️', '🎯'];
const HABIT_FREQUENCIES = [
  { value: 'daily', label: 'Daily' },
  { value: 'weekly', label: 'Weekly' },
  { value: 'monthly', label: 'Monthly' },
];

function HabitMiniChart({ habit }) {
  const history = useMemo(() => computeHabitHistory(habit, 8), [habit]);
  return (
    <div className="flex items-end gap-1">
      {history.map((h, i) => (
        <div key={i} className="flex flex-col items-center gap-0.5">
          <div className={cn('h-6 w-2.5 rounded-sm transition-colors', h.done ? '' : 'bg-neutral-100 dark:bg-neutral-800')}
            style={h.done ? { backgroundColor: habit.color } : undefined} title={h.label} />
        </div>
      ))}
    </div>
  );
}

function HabitRow({ habit, onDelete, weekDates, today, onToggleDay, onTogglePeriod }) {
  const streak = computeHabitStreak(habit);
  const longestStreak = computeHabitLongestStreak(habit);
  const completionPercent = computeHabitCompletionPercent(habit);
  const doneThisPeriod = isHabitDoneInCurrentPeriod(habit);

  return (
    <div className="flex flex-col gap-3 border-b border-neutral-50 py-4 last:border-0 dark:border-neutral-800/60 sm:flex-row sm:items-center sm:justify-between">
      <div className="flex min-w-0 items-center gap-3">
        <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-base" style={{ backgroundColor: `${habit.color}1A` }}>{habit.icon}</span>
        <div className="min-w-0">
          <p className="truncate font-medium text-neutral-700 dark:text-neutral-200">{habit.name}</p>
          <p className="text-xs text-neutral-400">🔥 {streak} current · 🏆 {longestStreak} best · {completionPercent}% completion</p>
        </div>
      </div>

      <div className="flex items-center gap-3">
        <HabitMiniChart habit={habit} />

        {habit.frequency === 'daily' ? (
          <div className="flex gap-1">
            {weekDates.map(d => {
              const iso = toISODate(d), done = habit.completions.includes(iso), isTodayCol = iso === today, isFuture = iso > today;
              return (
                <button key={iso} disabled={isFuture} onClick={() => isTodayCol && onToggleDay(habit.id)}
                  aria-label={`${habit.name} on ${d.toDateString()}: ${done ? 'completed' : 'not completed'}`} aria-pressed={done}
                  className={cn('flex h-7 w-7 items-center justify-center rounded-full border-2 transition-colors',
                    'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)]',
                    done ? 'text-white' : 'border-neutral-200 dark:border-neutral-700', isTodayCol && !done && 'border-dashed border-neutral-400', isFuture && 'opacity-30', !isTodayCol && 'cursor-default')}
                  style={done ? { backgroundColor: habit.color, borderColor: habit.color } : undefined}>
                  {done && <Icon name="check" size={12} strokeWidth={3} />}
                </button>
              );
            })}
          </div>
        ) : (
          <button onClick={() => onTogglePeriod(habit.id)} aria-pressed={doneThisPeriod}
            className={cn('flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors',
              doneThisPeriod ? 'border-transparent text-white' : 'border-neutral-200 text-neutral-500 hover:bg-neutral-50 dark:border-neutral-700 dark:text-neutral-400 dark:hover:bg-neutral-800')}
            style={doneThisPeriod ? { backgroundColor: habit.color } : undefined}>
            <Icon name={doneThisPeriod ? 'check' : 'plus'} size={13} strokeWidth={3} />
            {doneThisPeriod ? `Done this ${habit.frequency === 'weekly' ? 'week' : 'month'}` : `Mark this ${habit.frequency === 'weekly' ? 'week' : 'month'}`}
          </button>
        )}

        <button onClick={() => onDelete(habit.id)} aria-label={`Delete habit ${habit.name}`} className="rounded p-1.5 text-neutral-300 hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-500/10">
          <Icon name="trash" size={14} />
        </button>
      </div>
    </div>
  );
}

function Habits() {
  const { habits, addHabit, deleteHabit, toggleToday, toggleCurrentPeriod } = useHabits();
  const [name, setName] = useState('');
  const [icon, setIcon] = useState(HABIT_ICONS[0]);
  const [color, setColor] = useState(HABIT_COLORS[0]);
  const [frequency, setFrequency] = useState('daily');
  const week = useMemo(() => getWeekDates(), []);
  const today = todayISO();

  const handleAdd = (e) => { e.preventDefault(); if (!name.trim()) return; addHabit(name.trim(), icon, color, frequency); setName(''); };

  const dailyHabits = habits.filter(h => h.frequency === 'daily' || !h.frequency);
  const weeklyHabits = habits.filter(h => h.frequency === 'weekly');
  const monthlyHabits = habits.filter(h => h.frequency === 'monthly');

  const overallCompletion = habits.length === 0 ? 0 : Math.round(habits.reduce((sum, h) => sum + computeHabitCompletionPercent(h), 0) / habits.length);

  const groups = [
    { key: 'daily', label: 'Daily Habits', list: dailyHabits, icon: 'sun' },
    { key: 'weekly', label: 'Weekly Habits', list: weeklyHabits, icon: 'calendar-clock' },
    { key: 'monthly', label: 'Monthly Habits', list: monthlyHabits, icon: 'calendar' },
  ];

  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Habits</h1>
          <p className="text-sm text-neutral-400 dark:text-neutral-500">Build consistency, one day at a time.</p>
        </div>
        {habits.length > 0 && <ProgressRing percent={overallCompletion} size={56} strokeWidth={5} color="var(--accent)" sublabel="overall" />}
      </div>

      <form onSubmit={handleAdd} className="flex flex-col gap-3 rounded-2xl border border-neutral-100 bg-white p-3 dark:border-neutral-800 dark:bg-neutral-850 sm:flex-row sm:flex-wrap sm:items-center">
        <div className="flex gap-1">
          {HABIT_ICONS.map(i => (
            <button type="button" key={i} onClick={() => setIcon(i)} aria-pressed={icon === i} aria-label={`Icon ${i}`}
              className={cn('flex h-8 w-8 items-center justify-center rounded-lg text-base transition-colors', icon === i ? 'bg-[var(--accent)]/15' : 'hover:bg-neutral-100 dark:hover:bg-neutral-800')}>
              {i}
            </button>
          ))}
        </div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Add a new habit, e.g. Drink water" aria-label="New habit name"
          className="h-9 min-w-[180px] flex-1 rounded-lg border border-neutral-200 bg-white px-3 text-sm focus:border-[var(--accent)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-ring)] dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100" />
        <div className="flex gap-1">
          {HABIT_COLORS.map(c => (
            <button type="button" key={c} onClick={() => setColor(c)} aria-pressed={color === c} aria-label={`Color ${c}`}
              className={cn('h-6 w-6 rounded-full ring-offset-2 dark:ring-offset-neutral-850', color === c && 'ring-2 ring-neutral-400')} style={{ backgroundColor: c }} />
          ))}
        </div>
        <select value={frequency} onChange={(e) => setFrequency(e.target.value)} aria-label="Habit frequency"
          className="h-9 rounded-lg border border-neutral-200 bg-white px-2 text-xs font-medium text-neutral-600 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-300">
          {HABIT_FREQUENCIES.map(f => <option key={f.value} value={f.value}>{f.label}</option>)}
        </select>
        <Button type="submit" variant="primary" size="sm"><Icon name="plus" size={14} />Add habit</Button>
      </form>

      {habits.length === 0 ? (
        <EmptyState icon="repeat" title="No habits yet" description="Add your first habit above to start tracking streaks." />
      ) : (
        groups.filter(g => g.list.length > 0).map(g => (
          <div key={g.key} className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850">
            <h2 className="mb-1 flex items-center gap-1.5 text-sm font-semibold text-neutral-700 dark:text-neutral-200">
              <Icon name={g.icon} size={14} className="text-neutral-400" />{g.label}
            </h2>
            <div className="flex flex-col">
              {g.list.map(habit => (
                <HabitRow key={habit.id} habit={habit} onDelete={deleteHabit} weekDates={week} today={today} onToggleDay={toggleToday} onTogglePeriod={toggleCurrentPeriod} />
              ))}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function Analytics() {
  const { tasks } = useTasks();
  const { habits } = useHabits();
  const { sessions } = usePomodoro();
  const [granularity, setGranularity] = useState('daily');
  const active = useMemo(() => tasks.filter(t => !t.archived), [tasks]);
  const stats = useMemo(() => computeStats(tasks), [tasks]);
  const byCategory = useMemo(() => CATEGORIES.map(c => ({ ...c, count: active.filter(t => t.category === c.value).length })).filter(c => c.count > 0), [active]);
  const byPriority = useMemo(() => PRIORITIES.map(p => ({ ...p, count: active.filter(t => t.priority === p.value).length })), [active]);
  const totalTime = useMemo(() => active.reduce((acc, t) => { acc.estimated += t.estimatedMinutes ?? 0; acc.actual += t.actualMinutes ?? 0; return acc; }, { estimated: 0, actual: 0 }), [active]);
  const avgCompletionHours = useMemo(() => computeAverageCompletionHours(tasks), [tasks]);
  const mostProductiveDay = useMemo(() => computeMostProductiveDay(tasks), [tasks]);
  const mostProductiveHour = useMemo(() => computeMostProductiveHour(tasks), [tasks]);
  const estimateAccuracy = useMemo(() => computeEstimateAccuracy(tasks), [tasks]);
  const weeklyReview = useMemo(() => computeWeeklyReview(tasks, sessions, habits), [tasks, sessions, habits]);

  const trendPeriods = granularity === 'monthly' ? 6 : granularity === 'weekly' ? 8 : 7;
  const trend = useMemo(() => computeProductivityTrend(tasks, granularity, trendPeriods), [tasks, granularity]);
  const trendPrev = useMemo(() => {
    // completions in the first half of the window vs the second half, for a simple trend delta
    const half = Math.floor(trend.length / 2) || 1;
    const firstHalf = trend.slice(0, half).reduce((s, b) => s + b.count, 0);
    const secondHalf = trend.slice(half).reduce((s, b) => s + b.count, 0);
    if (firstHalf === 0) return secondHalf > 0 ? 100 : 0;
    return Math.round(((secondHalf - firstHalf) / firstHalf) * 100);
  }, [trend]);

  if (active.length === 0) {
    return (
      <div className="flex flex-col gap-5">
        <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Analytics</h1>
        <EmptyState icon="bar-chart" title="No data yet" description="Add and complete a few tasks to see analytics here." />
      </div>
    );
  }

  const maxCategoryCount = Math.max(...byCategory.map(c => c.count), 1);
  const maxPriorityCount = Math.max(...byPriority.map(p => p.count), 1);
  const maxTrendCount = Math.max(...trend.map(b => b.count), 1);
  const totalDistribution = byPriority.reduce((s, p) => s + p.count, 0) || 1;

  return (
    <div className="flex flex-col gap-5">
      <div>
        <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Analytics</h1>
        <p className="text-sm text-neutral-400 dark:text-neutral-500">Insights from your task and habit activity.</p>
      </div>

      <div className="grid grid-cols-2 gap-4 sm:grid-cols-4">
        <TrendCard label="Completion Rate" value={stats.completionPercent} suffix="%" icon="circle-check" accent="#059669" deltaPercent={trendPrev} />
        <TrendCard label="Avg. Completion Time" value={avgCompletionHours < 24 ? avgCompletionHours : Math.round((avgCompletionHours / 24) * 10) / 10} suffix={avgCompletionHours < 24 ? 'h' : 'd'} icon="clock" accent="#2563EB" />
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850">
          <p className="text-xs font-medium text-neutral-400">Most Productive Day</p>
          <p className="mt-1 text-xl font-semibold text-neutral-900 dark:text-neutral-50">{mostProductiveDay ? mostProductiveDay.day : '—'}</p>
          {mostProductiveDay && <p className="mt-1 text-xs text-neutral-400">{mostProductiveDay.count} tasks completed</p>}
        </div>
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850">
          <p className="text-xs font-medium text-neutral-400">Most Productive Hour</p>
          <p className="mt-1 text-xl font-semibold text-neutral-900 dark:text-neutral-50">{mostProductiveHour ? mostProductiveHour.hour : '—'}</p>
          {mostProductiveHour && <p className="mt-1 text-xs text-neutral-400">{mostProductiveHour.count} tasks completed</p>}
        </div>
      </div>

      <div className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <div className="mb-4 flex flex-wrap items-center justify-between gap-2">
          <h2 className="text-sm font-semibold text-neutral-700 dark:text-neutral-200">Productivity trend</h2>
          <div className="flex gap-1 rounded-lg bg-neutral-100 p-1 dark:bg-neutral-800">
            {[{ v: 'daily', l: 'Daily' }, { v: 'weekly', l: 'Weekly' }, { v: 'monthly', l: 'Monthly' }].map(opt => (
              <button key={opt.v} onClick={() => setGranularity(opt.v)} aria-pressed={granularity === opt.v}
                className={cn('rounded-md px-2.5 py-1 text-xs font-medium transition-colors',
                  granularity === opt.v ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-white' : 'text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200')}>
                {opt.l}
              </button>
            ))}
          </div>
        </div>
        <div className="flex h-40 items-end justify-between gap-2">
          {trend.map((bucket, i) => (
            <div key={i} className="flex flex-1 flex-col items-center gap-2">
              <div className="flex h-32 w-full items-end rounded-md bg-neutral-100 dark:bg-neutral-800">
                <div className="w-full rounded-md bg-gradient-to-t from-indigo-600 to-indigo-400 transition-all duration-500" style={{ height: `${(bucket.count / maxTrendCount) * 100}%` }} role="img" aria-label={`${bucket.label}: ${bucket.count} completed`} />
              </div>
              <span className="text-[11px] font-medium text-neutral-400">{bucket.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <div className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
          <h2 className="mb-4 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Priority distribution</h2>
          <div className="flex items-center gap-5">
            <div className="relative flex items-center justify-center" style={{ width: 96, height: 96 }}>
              <svg width={96} height={96} className="-rotate-90">
                <circle cx={48} cy={48} r={40} fill="none" strokeWidth={12} className="stroke-neutral-100 dark:stroke-neutral-800" />
                {(() => {
                  const circumference = 2 * Math.PI * 40;
                  let offsetAcc = 0;
                  return byPriority.filter(p => p.count > 0).map(p => {
                    const fraction = p.count / totalDistribution;
                    const dash = fraction * circumference;
                    const el = (
                      <circle key={p.value} cx={48} cy={48} r={40} fill="none" strokeWidth={12} stroke={p.color}
                        strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={-offsetAcc} strokeLinecap="butt" />
                    );
                    offsetAcc += dash;
                    return el;
                  });
                })()}
              </svg>
              <div className="absolute flex flex-col items-center">
                <span className="text-lg font-semibold text-neutral-900 dark:text-neutral-50">{active.length}</span>
                <span className="text-[10px] text-neutral-400">tasks</span>
              </div>
            </div>
            <div className="flex flex-1 flex-col gap-2">
              {byPriority.map(p => (
                <div key={p.value} className="flex items-center gap-2 text-xs">
                  <span className="h-2 w-2 shrink-0 rounded-full" style={{ backgroundColor: p.color }} />
                  <span className="flex-1 text-neutral-500 dark:text-neutral-400">{p.label}</span>
                  <span className="font-medium text-neutral-700 dark:text-neutral-200">{p.count}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
          <h2 className="mb-4 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Category distribution</h2>
          <div className="flex flex-col gap-3">
            {byCategory.map(c => (
              <div key={c.value} className="flex items-center gap-3">
                <span className="w-24 shrink-0 text-xs text-neutral-500 dark:text-neutral-400">{c.icon} {c.label}</span>
                <div className="h-2 flex-1 overflow-hidden rounded-full bg-neutral-100 dark:bg-neutral-800"><div className="h-full rounded-full transition-all duration-500" style={{ width: `${(c.count / maxCategoryCount) * 100}%`, backgroundColor: c.color }} /></div>
                <span className="w-6 text-right text-xs font-medium text-neutral-500">{c.count}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {habits.length > 0 && (
        <div className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
          <h2 className="mb-4 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Habit consistency</h2>
          <div className="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
            {habits.map(h => (
              <div key={h.id} className="flex flex-col items-center gap-2 rounded-xl border border-neutral-100 p-3 dark:border-neutral-800">
                <ProgressRing percent={computeHabitCompletionPercent(h)} size={64} strokeWidth={6} color={h.color} />
                <span className="flex items-center gap-1 truncate text-xs font-medium text-neutral-600 dark:text-neutral-300"><span aria-hidden="true">{h.icon}</span>{h.name}</span>
                <span className="text-[10px] text-neutral-400">🔥 {computeHabitStreak(h)} streak</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-4 sm:grid-cols-5">
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850"><p className="text-xs font-medium text-neutral-400">Total tasks</p><p className="mt-1 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">{active.length}</p></div>
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850"><p className="text-xs font-medium text-neutral-400">Est. minutes</p><p className="mt-1 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">{totalTime.estimated}</p></div>
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850"><p className="text-xs font-medium text-neutral-400">Actual minutes</p><p className="mt-1 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">{totalTime.actual}</p></div>
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850"><p className="text-xs font-medium text-neutral-400">Overdue</p><p className="mt-1 text-2xl font-semibold text-neutral-900 dark:text-neutral-50">{stats.overdue}</p></div>
        <div className="rounded-2xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-850">
          <p className="text-xs font-medium text-neutral-400">Est. vs Actual</p>
          {estimateAccuracy ? (
            <p className={cn('mt-1 text-2xl font-semibold', estimateAccuracy.avgVariancePercent > 0 ? 'text-red-500' : 'text-emerald-600 dark:text-emerald-400')}>
              {estimateAccuracy.avgVariancePercent > 0 ? '+' : ''}{estimateAccuracy.avgVariancePercent}%
            </p>
          ) : <p className="mt-1 text-2xl font-semibold text-neutral-300 dark:text-neutral-600">—</p>}
        </div>
      </div>

      <div className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <div className="mb-4 flex items-center gap-1.5">
          <Icon name="zap" size={15} className="text-indigo-500" />
          <h2 className="text-sm font-semibold text-neutral-700 dark:text-neutral-200">Weekly Review</h2>
        </div>

        <div className="grid grid-cols-2 gap-4 sm:grid-cols-4">
          <div><p className="text-xs font-medium text-neutral-400">Completed</p><p className="mt-1 text-xl font-semibold text-neutral-900 dark:text-neutral-50">{weeklyReview.completedThisWeek.length}</p></div>
          <div><p className="text-xs font-medium text-neutral-400">Created</p><p className="mt-1 text-xl font-semibold text-neutral-900 dark:text-neutral-50">{weeklyReview.createdThisWeek.length}</p></div>
          <div><p className="text-xs font-medium text-neutral-400">Focus Time</p><p className="mt-1 text-xl font-semibold text-neutral-900 dark:text-neutral-50">{Math.round(weeklyReview.focusMinutes / 60 * 10) / 10}<span className="text-sm text-neutral-400"> h</span></p></div>
          <div><p className="text-xs font-medium text-neutral-400">Avg. Completion</p><p className="mt-1 text-xl font-semibold text-neutral-900 dark:text-neutral-50">{weeklyReview.perf.average}%</p></div>
        </div>

        {weeklyReview.achievements.length > 0 && (
          <div className="mt-4 border-t border-neutral-100 pt-4 dark:border-neutral-800">
            <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-neutral-400">Achievements</p>
            <div className="flex flex-wrap gap-2">
              {weeklyReview.achievements.map((a, i) => (
                <span key={i} className="flex items-center gap-1.5 rounded-full bg-amber-50 px-3 py-1 text-xs font-medium text-amber-700 dark:bg-amber-500/10 dark:text-amber-400">
                  <Icon name={a.icon} size={12} />{a.label}
                </span>
              ))}
            </div>
          </div>
        )}

        <div className="mt-4 border-t border-neutral-100 pt-4 dark:border-neutral-800">
          <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-neutral-400">Improvement suggestions</p>
          <ul className="flex flex-col gap-1.5">
            {weeklyReview.suggestions.map((s, i) => (
              <li key={i} className="flex items-start gap-2 text-xs text-neutral-500 dark:text-neutral-400">
                <Icon name="zap" size={11} className="mt-0.5 shrink-0 text-[var(--accent)]" />{s}
              </li>
            ))}
          </ul>
        </div>
      </div>
    </div>
  );
}

const THEME_OPTIONS = [{ value: 'light', label: 'Light', icon: 'sun' }, { value: 'dark', label: 'Dark', icon: 'moon' }, { value: 'system', label: 'System', icon: 'monitor' }];

function Settings() {
  const { theme, setTheme } = useTheme();
  const { accent, setAccent } = useAccentColor();
  const { compact, setCompact } = useCompactMode();
  const { tasks } = useTasks();
  const { habits } = useHabits();
  const { pushToast } = useUI();
  const fileInputRef = useRef(null);
  const [resetOpen, setResetOpen] = useState(false);
  const [notificationsEnabled, setNotificationsEnabled] = useLocalStorage(STORAGE_KEYS.notificationsEnabled, false);
  const [permissionStatus, setPermissionStatus] = useState(() => ('Notification' in window ? Notification.permission : 'unsupported'));

  const handleExport = () => {
    const payload = { version: 1, exportedAt: new Date().toISOString(), tasks, habits };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `gatistwam-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    pushToast({ message: 'Data exported' });
  };

  const handleImportClick = () => fileInputRef.current?.click();
  const handleImportFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (Array.isArray(parsed.tasks)) window.localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(parsed.tasks));
        if (Array.isArray(parsed.habits)) window.localStorage.setItem(STORAGE_KEYS.habits, JSON.stringify(parsed.habits));
        pushToast({ message: 'Import complete. Reloading…' });
        window.setTimeout(() => window.location.reload(), 800);
      } catch { pushToast({ message: 'That file could not be read as a valid export.' }); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const handleReset = () => {
    Object.values(STORAGE_KEYS).forEach(key => window.localStorage.removeItem(key));
    setResetOpen(false);
    pushToast({ message: 'All data cleared. Reloading…' });
    window.setTimeout(() => window.location.reload(), 600);
  };

  const handleEnableNotifications = async () => {
    const result = await requestBrowserNotificationPermission();
    setPermissionStatus(result);
    setNotificationsEnabled(result === 'granted');
    pushToast({ message: result === 'granted' ? 'Browser notifications enabled' : 'Notification permission was not granted' });
  };

  return (
    <div className="flex max-w-2xl flex-col gap-6">
      <div>
        <h1 className="text-xl font-semibold text-neutral-900 dark:text-neutral-50">Settings</h1>
        <p className="text-sm text-neutral-400 dark:text-neutral-500">Manage appearance, notifications, and your local data.</p>
      </div>

      <section className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <h2 className="mb-1 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Theme</h2>
        <p className="mb-4 text-xs text-neutral-400">Choose how Gatistwam looks on this device.</p>
        <div className="flex gap-2">
          {THEME_OPTIONS.map(opt => (
            <button key={opt.value} onClick={() => setTheme(opt.value)} aria-pressed={theme === opt.value}
              className={cn('flex flex-1 flex-col items-center gap-2 rounded-xl border p-4 text-sm font-medium transition-colors',
                'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)]',
                theme === opt.value ? 'border-[var(--accent)] bg-[var(--accent)]/10 text-[var(--accent)]' : 'border-neutral-200 text-neutral-500 hover:bg-neutral-50 dark:border-neutral-700 dark:text-neutral-400 dark:hover:bg-neutral-800')}>
              <Icon name={opt.icon} size={18} />{opt.label}
            </button>
          ))}
        </div>
      </section>

      <section className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <h2 className="mb-1 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Accent color</h2>
        <p className="mb-4 text-xs text-neutral-400">Applied to primary buttons, active navigation, and score rings.</p>
        <div className="flex flex-wrap gap-3">
          {ACCENT_COLORS.map(c => (
            <button key={c.value} onClick={() => setAccent(c.value)} aria-label={c.name} aria-pressed={accent === c.value}
              className={cn('flex h-10 w-10 items-center justify-center rounded-full ring-offset-2 transition-transform hover:scale-110 dark:ring-offset-neutral-850',
                accent === c.value && 'ring-2 ring-neutral-400')}
              style={{ backgroundColor: c.value }} title={c.name}>
              {accent === c.value && <Icon name="check" size={16} strokeWidth={3} className="text-white" />}
            </button>
          ))}
        </div>
      </section>

      <section className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-sm font-semibold text-neutral-700 dark:text-neutral-200">Compact mode</h2>
            <p className="mt-1 text-xs text-neutral-400">Tighter spacing and padding across the app.</p>
          </div>
          <button onClick={() => setCompact(c => !c)} role="switch" aria-checked={compact} aria-label="Toggle compact mode"
            className={cn('relative h-6 w-11 shrink-0 rounded-full transition-colors', compact ? 'bg-[var(--accent)]' : 'bg-neutral-200 dark:bg-neutral-700')}>
            <span className={cn('absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform', compact ? 'translate-x-[22px]' : 'translate-x-0.5')} />
          </button>
        </div>
      </section>

      <section className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <h2 className="mb-1 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Notifications</h2>
        <p className="mb-4 text-xs text-neutral-400">Get a native browser notification for overdue tasks and things due within 30 minutes.</p>
        {permissionStatus === 'unsupported' ? (
          <p className="text-xs text-neutral-400">This browser doesn't support notifications.</p>
        ) : permissionStatus === 'granted' && notificationsEnabled ? (
          <div className="flex items-center gap-2">
            <span className="flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-medium text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400">
              <Icon name="circle-check" size={13} />Enabled
            </span>
            <Button variant="ghost" size="sm" onClick={() => setNotificationsEnabled(false)}>Turn off</Button>
          </div>
        ) : (
          <Button variant="secondary" size="sm" onClick={handleEnableNotifications}>
            <Icon name="bell" size={14} />Enable browser notifications
          </Button>
        )}
      </section>

      <section className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <h2 className="mb-1 text-sm font-semibold text-neutral-700 dark:text-neutral-200">Your data</h2>
        <p className="mb-4 text-xs text-neutral-400">Everything is stored locally in this browser — {tasks.length} tasks, {habits.length} habits.</p>
        <div className="flex flex-wrap gap-2">
          <Button variant="secondary" size="sm" onClick={handleExport}><Icon name="archive" size={14} />Export JSON</Button>
          <Button variant="secondary" size="sm" onClick={handleImportClick}><Icon name="copy" size={14} />Import JSON</Button>
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={handleImportFile} />
          <Button variant="danger" size="sm" onClick={() => setResetOpen(true)}><Icon name="trash" size={14} />Reset all data</Button>
        </div>
      </section>

      <section className="rounded-2xl border border-neutral-100 bg-white p-5 dark:border-neutral-800 dark:bg-neutral-850">
        <h2 className="mb-1 text-sm font-semibold text-neutral-700 dark:text-neutral-200">About</h2>
        <p className="text-xs text-neutral-400">Gatistwam · Daily Productivity Dashboard · Production · v1.0</p>
      </section>

      <ConfirmDialog isOpen={resetOpen} title="Reset all data" message="This permanently deletes every task, habit, focus session, and preference stored on this device. This can't be undone." confirmLabel="Reset everything" onCancel={() => setResetOpen(false)} onConfirm={handleReset} />
    </div>
  );
}

}

function AppShell() {
  const { page, setPage, searchQuery, setSearchQuery, toasts, pushToast, dismissToast, sidebarOpen, setSidebarOpen, setCommandPaletteOpen, selectedTaskId } = useUI();
  const { theme, setTheme } = useTheme();
  useAccentColor();
  useCompactMode();
  const [sidebarCollapsed, setSidebarCollapsed] = useSidebarCollapsed();
  const [notificationsEnabled] = useLocalStorage(STORAGE_KEYS.notificationsEnabled, false);
  const { tasks } = useTasks();
  const taskActions = useTaskActions();
  const overdueCount = useMemo(() => tasks.filter(t => !t.archived && isOverdue(t.dueDate, t.status)).length, [tasks]);
  const ActivePage = PAGES[page];

  useNotificationScheduler(tasks, notificationsEnabled, pushToast);

  // Global keyboard shortcuts — Ctrl/Cmd+K (command palette), Ctrl/Cmd+/ (search),
  // N (new task), Delete (delete selected task), Space (complete selected task).
  useEffect(() => {
    const handler = (e) => {
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setCommandPaletteOpen(o => !o);
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === '/') {
        e.preventDefault();
        const el = document.getElementById('global-search-input');
        if (el) el.focus();
        return;
      }
      if (isTyping) return;
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        taskActions.openCreate();
        return;
      }
      if (e.key === 'Delete') {
        if (selectedTaskId) {
          const task = tasks.find(t => t.id === selectedTaskId);
          if (task) { e.preventDefault(); taskActions.handleDeleteRequest(task); }
        }
        return;
      }
      if (e.key === ' ') {
        if (selectedTaskId) {
          const task = tasks.find(t => t.id === selectedTaskId);
          if (task) { e.preventDefault(); taskActions.handleToggleComplete(task); }
        }
        return;
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [selectedTaskId, tasks, taskActions, setCommandPaletteOpen]);

  return (
    <div className="flex h-screen w-full overflow-hidden bg-neutral-50 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100">
      <Sidebar activePage={page} onNavigate={setPage} mobileOpen={sidebarOpen} onCloseMobile={() => setSidebarOpen(false)}
        collapsed={sidebarCollapsed} onToggleCollapsed={() => setSidebarCollapsed(c => !c)} />
      <div className="flex min-w-0 flex-1 flex-col">
        <Header searchQuery={searchQuery} onSearchChange={setSearchQuery} theme={theme} onThemeChange={setTheme} notificationCount={overdueCount}
          onOpenMobileNav={() => setSidebarOpen(true)} onOpenCommandPalette={() => setCommandPaletteOpen(true)} />
        <ReminderBanner tasks={tasks} onOpenTask={taskActions.openEdit} />
        <main id="main-content" tabIndex={-1} className="flex-1 overflow-y-auto px-4 py-6 pb-24 sm:px-6 lg:px-8 lg:pb-6 focus:outline-none">
          <div key={page} className="animate-page-in">
            <ActivePage />
          </div>
        </main>
      </div>
      <MobileBottomNav activePage={page} onNavigate={setPage} onOpenMore={() => setSidebarOpen(true)} />
      <ToastStack toasts={toasts} onDismiss={dismissToast} />
      <CommandPalette />
      <GlobalTaskDialogs />
    </div>
  );
}

function App() {
  return (
    <UIProvider>
      <TaskProvider>
        <HabitProvider>
          <PomodoroProvider>
            <AppShell />
          </PomodoroProvider>
        </HabitProvider>
      </TaskProvider>
    </UIProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
